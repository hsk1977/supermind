<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fruit Ninja - Mobile Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .btn-home-top {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background: #e74c3c;
      color: white;
      border: 2px solid #c0392b;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
      text-decoration: none;
    }

    #ui {
      position: absolute;
      top: 15px;
      left: 70px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
    }
    .btn-ingame-menu {
      pointer-events: auto;
      background: #34495e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .stats-group {
      display: flex;
      gap: 12px;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .score-box { color: #f1c40f; }
    .high-box { color: #2ecc71; }
    .timer-box { color: #3498db; }
    .lives-box { color: #e74c3c; }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    
    .main-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #ff8c00;
      background: linear-gradient(180deg, #ffc048 0%, #ff5252 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
    }

    .sub-title {
      font-size: 16px;
      color: #cccccc;
      margin-bottom: 20px;
    }

    .mode-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 320px;
    }

    .mode-card {
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-card.selected {
      border-color: #f39c12;
      box-shadow: 0 0 15px rgba(243, 156, 18, 0.4);
      background: #25231f;
    }

    .mode-card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .mode-card-desc {
      font-size: 12px;
      color: #aaa;
    }

    .blade-section-title {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 10px;
    }

    .blade-options {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .blade-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
    }

    .blade-circle.selected {
      border-color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .btn-play {
      background: #2ecc71;
      color: #ffffff;
      border: none;
      padding: 12px 36px;
      border-radius: 25px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
    }

    .hidden { display: none !important; }

    #activeEffects {
      position: absolute;
      bottom: 15px;
      left: 15px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .effect-badge {
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 13px;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <a href="index.html" class="btn-home-top" title="Go to Index">🏠</a>

    <div id="ui" class="hidden">
      <button id="menuBtn" class="btn-ingame-menu">⚙️ Menu</button>

      <div class="stats-group">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="high-box">Best: <span id="highScore">0</span></div>
        <div class="timer-box" id="timerBox">Time: <span id="timer">60</span>s</div>
        <div class="lives-box hidden" id="livesBox"><span id="lives">❤️❤️❤️</span></div>
      </div>
    </div>

    <div id="activeEffects"></div>

    <canvas id="canvas"></canvas>

    <div id="startScreen" class="overlay">
      <h1 class="main-title">FRUIT NINJA</h1>
      <div class="sub-title">Select Game Mode:</div>

      <div class="mode-container">
        <div class="mode-card selected" id="card-arcade" onclick="selectMode('arcade')">
          <div class="mode-card-title" style="color: #f1c40f;">⚡ Arcade</div>
          <div class="mode-card-desc">60s Timer, Slow Smooth Launches & Powerups</div>
        </div>

        <div class="mode-card" id="card-classic" onclick="selectMode('classic')">
          <div class="mode-card-title" style="color: #e67e22;">⚔️ Classic</div>
          <div class="mode-card-desc">3 Lives. Avoid Bombs!</div>
        </div>

        <div class="mode-card" id="card-zen" onclick="selectMode('zen')">
          <div class="mode-card-title" style="color: #f39c12;">🧘 Zen</div>
          <div class="mode-card-desc">90s Relaxing mode, No Bombs</div>
        </div>
      </div>

      <div class="blade-section-title">Choose Blade Style:</div>
      <div class="blade-options">
        <div class="blade-circle selected" id="blade-ice" style="background: #00d2d3;" onclick="selectBlade('ice')"></div>
        <div class="blade-circle" id="blade-fire" style="background: #ff3838;" onclick="selectBlade('fire')"></div>
        <div class="blade-circle" id="blade-rainbow" style="background: linear-gradient(135deg, #ff4d4d, #3498db, #2ecc71);" onclick="selectBlade('rainbow')"></div>
        <div class="blade-circle" id="blade-shadow" style="background: #a55eea;" onclick="selectBlade('shadow')"></div>
        <div class="blade-circle" id="blade-lime" style="background: #2ecc71;" onclick="selectBlade('lime')"></div>
      </div>

      <button class="btn-play" onclick="startGame()">Play Game 🍉</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="main-title" id="gameOverTitle" style="font-size: 36px;">Time's Up! ⏳</h1>
      <p style="font-size: 20px; margin-bottom: 8px;">Final Score: <span id="finalScore" style="color: #f1c40f;">0</span></p>
      <p style="font-size: 16px; color: #aaa; margin-bottom: 20px;">High Score: <span id="finalHighScore" style="color: #2ecc71;">0</span></p>
      <button class="btn-play" onclick="startGame()">Play Again 🔄</button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSliceSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700 + Math.random() * 200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playHitSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playExplodeSound() {
      if (!audioCtx) return;
      const bufferSize = audioCtx.sampleRate * 0.4;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(600, audioCtx.currentTime);
      filter.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
      noise.stop(audioCtx.currentTime + 0.4);
    }

    function playPowerupSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(350, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(1000, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const FRUITS = [
      { emoji: '🍉', color: '#ff4d4d' },
      { emoji: '🍎', color: '#ff3333' },
      { emoji: '🍌', color: '#ffe600' },
      { emoji: '🍍', color: '#ffa600' },
      { emoji: '🍊', color: '#ff8c00' },
      { emoji: '🥝', color: '#88c425' },
      { emoji: '🍇', color: '#9b59b6' }
    ];

    const POWERUPS = [
      { type: 'freeze', emoji: '❄️', color: '#00d2d3' },
      { type: 'frenzy', emoji: '⚡', color: '#ff9f43' },
      { type: 'double', emoji: '💎', color: '#54a0ff' },
      { type: 'time', emoji: '⏳', color: '#10ac84' }
    ];

    let items = [];
    let particles = [];
    let splatters = [];
    let floatingTexts = [];
    let bladePath = [];
    
    let selectedMode = 'arcade';
    let selectedBlade = 'ice';

    let score = 0;
    let highScore = parseInt(localStorage.getItem('fn_highscore') || '0');
    let timeLeft = 60;
    let lives = 3;
    let isGameOver = true;
    let spawnTimer = 0;
    let timerInterval = null;

    let freezeActive = false;
    let freezeTimer = null;
    let frenzyActive = false;
    let frenzyTimer = null;
    let doubleActive = false;
    let doubleTimer = null;

    let isMouseDown = false;
    let activeSwipe = null;
    let shakeDuration = 0;

    document.getElementById('highScore').innerText = highScore;

    function selectMode(mode) {
      selectedMode = mode;
      document.querySelectorAll('.mode-card').forEach(el => el.classList.remove('selected'));
      document.getElementById(`card-${mode}`).classList.add('selected');
    }

    function selectBlade(blade) {
      selectedBlade = blade;
      document.querySelectorAll('.blade-circle').forEach(el => el.classList.remove('selected'));
      document.getElementById(`blade-${blade}`).classList.add('selected');
    }

    function addBladePoint(x, y) {
      bladePath.push({ x, y, time: Date.now() });
    }

    function resetSwipeTracker() {
      activeSwipe = { textObj: null, count: 0, score: 0, avgX: 0, minY: Infinity };
    }

    function endSwipeTracker() {
      isMouseDown = false;
      activeSwipe = null;
    }

    window.addEventListener('mousedown', (e) => {
      initAudio();
      isMouseDown = true;
      bladePath = [];
      resetSwipeTracker();
      addBladePoint(e.clientX, e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      if (isMouseDown) addBladePoint(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', endSwipeTracker);

    window.addEventListener('touchstart', (e) => {
      initAudio();
      isMouseDown = true;
      const touch = e.touches[0];
      bladePath = [];
      resetSwipeTracker();
      addBladePoint(touch.clientX, touch.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (isMouseDown) {
        const touch = e.touches[0];
        addBladePoint(touch.clientX, touch.clientY);
      }
    });

    window.addEventListener('touchend', endSwipeTracker);

    class Item {
      constructor(customX = null, customVX = null, customVY = null, isPackage = false) {
        this.x = customX !== null ? customX : Math.random() * (canvas.width - 160) + 80;
        this.y = canvas.height + 40;
        
        // SLOWED DOWN SPEED: Throw force reduced significantly for easy touch control
        const throwPower = 10.5;
        const heightMultiplier = Math.sqrt(canvas.height / 700);
        
        this.vx = customVX !== null ? customVX : (Math.random() - 0.5) * 2.5;
        this.vy = customVY !== null ? customVY : -(Math.random() * 2.0 + throwPower) * heightMultiplier;
        
        // Low gravity makes items float gently in the air
        this.gravity = 0.10;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.04;

        this.isPackage = isPackage;
        this.lastHitTime = 0;
        this.isPowerup = false;
        this.powerupType = null;

        if (this.isPackage) {
          this.radius = 48;
          this.hitsLeft = 2; // Reduced hits needed for bags
          this.containedFruits = [];
          const count = Math.floor(Math.random() * 3) + 2; 
          for (let i = 0; i < count; i++) {
            this.containedFruits.push(FRUITS[Math.floor(Math.random() * FRUITS.length)]);
          }
          this.emoji = '🛍️';
          this.color = '#3498db';
        } else {
          this.radius = 38;
          
          const bombChance = (selectedMode === 'zen') ? 0 : 0.12;
          this.isBomb = Math.random() < bombChance;

          if (!this.isBomb) {
            if (selectedMode === 'arcade' && Math.random() < 0.18) {
              this.isPowerup = true;
              const p = POWERUPS[Math.floor(Math.random() * POWERUPS.length)];
              this.powerupType = p.type;
              this.emoji = p.emoji;
              this.color = p.color;
            } else {
              const f = FRUITS[Math.floor(Math.random() * FRUITS.length)];
              this.emoji = f.emoji;
              this.color = f.color;
            }
          } else {
            this.emoji = '💣';
            this.color = '#ff1a1a';
          }
        }

        this.sliced = false;
        this.halves = [];
      }

      update() {
        const timeScale = freezeActive ? 0.4 : 1.0;

        if (!this.sliced) {
          this.x += this.vx * timeScale;
          this.y += this.vy * timeScale;
          this.vy += this.gravity * timeScale;
          this.rotation += this.vRot * timeScale;
        } else {
          this.halves.forEach(h => {
            h.x += h.vx * timeScale;
            h.y += h.vy * timeScale;
            h.vy += this.gravity * timeScale;
            h.rot += h.vRot * timeScale;
          });
        }
      }

      draw() {
        ctx.save();
        if (!this.sliced) {
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);

          if (this.isPowerup) {
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 18;
          }

          if (this.isPackage) {
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.45)';
            ctx.strokeStyle = '#2980b9';
            ctx.lineWidth = 3;
            ctx.fill();
            ctx.stroke();

            ctx.font = '45px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, 0, 0);

            ctx.font = 'bold 20px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeText(this.hitsLeft, 20, -20);
            ctx.fillText(this.hitsLeft, 20, -20);
          } else {
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.emoji, 0, 0);
          }
        } else {
          this.halves.forEach(h => {
            ctx.save();
            ctx.translate(h.x, h.y);
            ctx.rotate(h.rot);
            ctx.font = '45px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.beginPath();
            if (h.side === 'left') {
              ctx.rect(-50, -50, 50, 100);
            } else {
              ctx.rect(0, -50, 50, 100);
            }
            ctx.clip();
            ctx.fillText(h.emoji, 0, 0);
            ctx.restore();
          });
        }
        ctx.restore();
      }

      hitPackage() {
        const now = Date.now();
        if (now - this.lastHitTime < 100) return false; 
        this.lastHitTime = now;
        this.hitsLeft--;
        playHitSound();
        createSplash(this.x, this.y, '#3498db', 6);

        if (this.hitsLeft <= 0) {
          return this.slicePackage();
        }
        return 'hit';
      }

      slicePackage() {
        this.sliced = true;
        playExplodeSound();
        createSplash(this.x, this.y, '#f39c12', 20);
        addSplatter(this.x, this.y, '#f39c12');

        this.containedFruits.forEach((f, idx) => {
          const offsetX = (idx - (this.containedFruits.length - 1) / 2) * 16;
          this.halves.push({
            emoji: f.emoji, x: this.x + offsetX - 6, y: this.y,
            vx: this.vx - 2 - Math.random() * 1.5, vy: this.vy + (Math.random() - 0.5) * 1.5,
            rot: this.rotation, vRot: 0.06, side: 'left'
          });
          this.halves.push({
            emoji: f.emoji, x: this.x + offsetX + 6, y: this.y,
            vx: this.vx + 2 + Math.random() * 1.5, vy: this.vy + (Math.random() - 0.5) * 1.5,
            rot: this.rotation, vRot: -0.06, side: 'right'
          });
        });
        return 'package_opened';
      }

      slice() {
        if (this.sliced) return false;
        if (this.isPackage) return this.hitPackage();

        this.sliced = true;
        if (this.isBomb) {
          playExplodeSound();
          createExplosion(this.x, this.y);
          triggerShake(15);
          
          triggerGameOver('You Hit a Bomb! 💣');
          return 'bomb';

        } else if (this.isPowerup) {
          playPowerupSound();
          activatePowerup(this.powerupType);
          createSplash(this.x, this.y, this.color, 16);
          return 'powerup';
        } else {
          createSplash(this.x, this.y, this.color, 10);
          addSplatter(this.x, this.y, this.color);

          this.halves.push({
            emoji: this.emoji, x: this.x - 6, y: this.y,
            vx: this.vx - 2, vy: this.vy, rot: this.rotation, vRot: 0.06, side: 'left'
          });
          this.halves.push({
            emoji: this.emoji, x: this.x + 6, y: this.y,
            vx: this.vx + 2, vy: this.vy, rot: this.rotation, vRot: -0.06, side: 'right'
          });
          return 'fruit';
        }
      }
    }

    function addSplatter(x, y, color) {
      splatters.push({
        x: x, y: y, radius: Math.random() * 20 + 15, color: color, alpha: 0.5,
        drips: Array.from({ length: 3 }, () => ({
          dx: (Math.random() - 0.5) * 20, dy: Math.random() * 30, r: Math.random() * 4 + 2
        }))
      });
      if (splatters.length > 20) splatters.shift();
    }

    function triggerShake(frames) {
      shakeDuration = frames;
    }

    function activatePowerup(type) {
      if (type === 'freeze') {
        freezeActive = true;
        clearTimeout(freezeTimer);
        freezeTimer = setTimeout(() => { freezeActive = false; updateEffectBadges(); }, 6000);
      } else if (type === 'frenzy') {
        frenzyActive = true;
        clearTimeout(frenzyTimer);
        frenzyTimer = setTimeout(() => { frenzyActive = false; updateEffectBadges(); }, 5000);
      } else if (type === 'double') {
        doubleActive = true;
        clearTimeout(doubleTimer);
        doubleTimer = setTimeout(() => { doubleActive = false; updateEffectBadges(); }, 8000);
      } else if (type === 'time') {
        timeLeft += 10;
        document.getElementById('timer').innerText = timeLeft;
        addFloatingText(canvas.width / 2, canvas.height / 2, '+10 SECONDS! ⏳', 32);
      }
      updateEffectBadges();
    }

    function updateEffectBadges() {
      const container = document.getElementById('activeEffects');
      container.innerHTML = '';
      if (freezeActive) container.innerHTML += `<div class="effect-badge" style="border-color:#00d2d3">FREEZE ❄️</div>`;
      if (frenzyActive) container.innerHTML += `<div class="effect-badge" style="border-color:#ff9f43">FRENZY ⚡</div>`;
      if (doubleActive) container.innerHTML += `<div class="effect-badge" style="border-color:#54a0ff">2x POINTS 💎</div>`;
    }

    function addFloatingText(x, y, text, fontSize = 24) {
      const ft = { x: x, y: y, text: text, fontSize: fontSize, alpha: 1, vy: -1.2 };
      floatingTexts.push(ft);
      return ft;
    }

    function spawnClusteredFruits() {
      const rand = Math.random();
      const countScale = frenzyActive ? 2 : 1;

      for (let c = 0; c < countScale; c++) {
        if (rand < 0.2) {
          items.push(new Item(null, null, null, true));
        } else if (rand < 0.65) {
          const clusterSize = Math.floor(Math.random() * 2) + 2;
          const baseX = Math.random() * (canvas.width - 200) + 100;
          const baseVX = (Math.random() - 0.5) * 2;
          const throwPower = 10.5;
          const heightMultiplier = Math.sqrt(canvas.height / 700);
          const baseVY = -(Math.random() * 1.5 + throwPower) * heightMultiplier;

          for (let i = 0; i < clusterSize; i++) {
            const offsetX = (i - (clusterSize - 1) / 2) * 35;
            const offsetY = (Math.random() - 0.5) * 15;
            const item = new Item(baseX + offsetX, baseVX + (Math.random() - 0.5) * 0.2, baseVY + (Math.random() - 0.5) * 0.3);
            item.y += offsetY;
            items.push(item);
          }
        } else {
          items.push(new Item());
        }
      }
    }

    function createSplash(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
          radius: Math.random() * 3 + 2, color: color, alpha: 1, life: 0.03
        });
      }
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: x, y: y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
          radius: Math.random() * 6 + 2, color: Math.random() < 0.5 ? '#ff4d4d' : '#ffa600',
          alpha: 1, life: 0.025
        });
      }
    }

    function checkSlices() {
      if (bladePath.length < 2) return;
      const p1 = bladePath[bladePath.length - 2];
      const p2 = bladePath[bladePath.length - 1];

      let hitInThisFrame = false;

      items.forEach(item => {
        if (!item.sliced) {
          const dist = distToSegment({ x: item.x, y: item.y }, p1, p2);
          if (dist < item.radius) {
            const res = item.slice();
            
            if (res === 'fruit' || res === 'package_opened' || res === 'powerup') {
              hitInThisFrame = true;
              let basePoints = (res === 'fruit') ? 10 : (res === 'package_opened' ? item.containedFruits.length * 10 : 15);
              if (doubleActive) basePoints *= 2;

              let countHit = (res === 'fruit') ? 1 : (res === 'package_opened' ? item.containedFruits.length : 1);

              if (activeSwipe) {
                activeSwipe.count += countHit;
                activeSwipe.score += basePoints;
                
                if (activeSwipe.count === countHit) { 
                  activeSwipe.avgX = item.x;
                  activeSwipe.minY = item.y;
                } else {
                  activeSwipe.avgX = (activeSwipe.avgX + item.x) / 2;
                  activeSwipe.minY = Math.min(activeSwipe.minY, item.y);
                }
              }
              score += basePoints;
            }
          }
        }
      });

      if (hitInThisFrame && activeSwipe && activeSwipe.count > 0) {
        playSliceSound();
        
        document.getElementById('score').innerText = score;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('fn_highscore', highScore);
          document.getElementById('highScore').innerText = highScore;
        }

        if (!activeSwipe.textObj) {
          activeSwipe.textObj = addFloatingText(activeSwipe.avgX, activeSwipe.minY - 25, `+${activeSwipe.score}`, 24);
        } else {
          let comboText = `+${activeSwipe.score}`;
          if (activeSwipe.count >= 3) comboText += ' GREAT COMBO! 🔥';
          else if (activeSwipe.count >= 2) comboText += ' COMBO!';

          activeSwipe.textObj.text = comboText;
          activeSwipe.textObj.fontSize = activeSwipe.count > 1 ? 30 : 24;
          activeSwipe.textObj.x = activeSwipe.avgX;
          activeSwipe.textObj.y = activeSwipe.minY - 30;
          activeSwipe.textObj.alpha = 1.2;
        }
      }
    }

    function distToSegment(p, v, w) {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function startTimer() {
      clearInterval(timerInterval);
      if (selectedMode === 'classic') return;

      timerInterval = setInterval(() => {
        if (!isGameOver) {
          timeLeft--;
          document.getElementById('timer').innerText = timeLeft;
          if (timeLeft <= 0) {
            triggerGameOver("Time's Up! ⏳");
          }
        }
      }, 1000);
    }

    function update() {
      if (isGameOver) return;

      ctx.save();
      if (shakeDuration > 0) {
        const dx = (Math.random() - 0.5) * 10;
        const dy = (Math.random() - 0.5) * 10;
        ctx.translate(dx, dy);
        shakeDuration--;
      }

      ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);

      splatters.forEach(s => {
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
        s.drips.forEach(d => {
          ctx.beginPath();
          ctx.arc(s.x + d.dx, s.y + d.dy, d.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      });

      spawnTimer++;
      const spawnInterval = frenzyActive ? 30 : 90;
      if (spawnTimer > spawnInterval) {
        spawnClusteredFruits();
        spawnTimer = 0;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.update();
        item.draw();

        if (item.y > canvas.height + 80) {
          if (selectedMode === 'classic' && !item.sliced && !item.isBomb) {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
              triggerGameOver('Out of Lives! 💔');
            }
          }
          items.splice(i, 1);
        }
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.015;

        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = Math.min(1, ft.alpha);
          ctx.font = `bold ${ft.fontSize}px Arial`;
          ctx.fillStyle = '#f1c40f';
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 3;
          ctx.textAlign = 'center';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.life;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const now = Date.now();
      bladePath = bladePath.filter(p => now - p.time < 160);

      if (bladePath.length > 1) {
        ctx.beginPath();
        ctx.moveTo(bladePath[0].x, bladePath[0].y);
        for (let i = 1; i < bladePath.length; i++) {
          ctx.lineTo(bladePath[i].x, bladePath[i].y);
        }
        ctx.lineCap = 'round';

        if (selectedBlade === 'ice') {
          ctx.strokeStyle = '#00d2d3';
          ctx.lineWidth = 6;
          ctx.shadowColor = '#48dbfb';
          ctx.shadowBlur = 10;
        } else if (selectedBlade === 'fire') {
          ctx.strokeStyle = '#ff3838';
          ctx.lineWidth = 7;
          ctx.shadowColor = '#ff4d4d';
          ctx.shadowBlur = 12;
        } else if (selectedBlade === 'rainbow') {
          ctx.strokeStyle = `hsl(${(now / 5) % 360}, 100%, 60%)`;
          ctx.lineWidth = 6;
          ctx.shadowColor = '#fff';
          ctx.shadowBlur = 8;
        } else if (selectedBlade === 'shadow') {
          ctx.strokeStyle = '#a55eea';
          ctx.lineWidth = 5;
          ctx.shadowColor = '#8854d0';
          ctx.shadowBlur = 10;
        } else if (selectedBlade === 'lime') {
          ctx.strokeStyle = '#2ecc71';
          ctx.lineWidth = 6;
          ctx.shadowColor = '#2ecc71';
          ctx.shadowBlur = 10;
        }
        ctx.stroke();
      }

      checkSlices();
      ctx.restore();
      requestAnimationFrame(update);
    }

    function updateLivesDisplay() {
      let str = '';
      for (let i = 0; i < 3; i++) {
        str += i < lives ? '❤️' : '🖤';
      }
      document.getElementById('lives').innerText = str;
    }

    function triggerGameOver(reason) {
      isGameOver = true;
      clearInterval(timerInterval);
      document.getElementById('ui').classList.add('hidden');
      document.getElementById('gameOverTitle').innerText = reason;
      document.getElementById('finalScore').innerText = score;
      document.getElementById('finalHighScore').innerText = highScore;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function startGame() {
      items = [];
      particles = [];
      splatters = [];
      floatingTexts = [];
      bladePath = [];
      score = 0;
      isGameOver = false;
      activeSwipe = null;
      freezeActive = false;
      frenzyActive = false;
      doubleActive = false;
      updateEffectBadges();

      document.getElementById('score').innerText = score;
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
      document.getElementById('ui').classList.remove('hidden');

      if (selectedMode === 'classic') {
        lives = 3;
        updateLivesDisplay();
        document.getElementById('livesBox').classList.remove('hidden');
        document.getElementById('timerBox').classList.add('hidden');
      } else {
        timeLeft = selectedMode === 'zen' ? 90 : 60;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('livesBox').classList.add('hidden');
        document.getElementById('timerBox').classList.remove('hidden');
        startTimer();
      }

      requestAnimationFrame(update);
    }

    document.getElementById('menuBtn').addEventListener('click', () => {
      isGameOver = true;
      clearInterval(timerInterval);
      document.getElementById('ui').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
      document.getElementById('gameOverScreen').classList.add('hidden');
    });
  </script>
</body>
