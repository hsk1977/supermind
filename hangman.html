<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی حدس کلمات - هنگ من</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
        }

        body {
            background-color: #2c1d11;
            background-image: radial-gradient(#4a3222 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 430px;
            background: #fff8eb;
            border: 6px solid #d4a359;
            border-radius: 36px;
            box-shadow: 0 0 0 5px #5c3a21, 0 25px 50px rgba(0, 0, 0, 0.7);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .back-btn {
            background: #d84315;
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 3px 0 #8c2703;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #3e2723;
        }

        .svg-container {
            width: 180px;
            height: 180px;
            background: #fff8eb;
            border: 2px dashed #b8860b;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hangman-svg {
            width: 140px;
            height: 140px;
        }

        .category {
            font-size: 0.9rem;
            color: #8d6e63;
            font-weight: 700;
        }

        .word-display {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
            direction: ltr;
        }

        .letter-box {
            width: 36px;
            height: 44px;
            border-bottom: 3px solid #3e2723;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            font-weight: 900;
            color: #3e2723;
        }

        .keyboard {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }

        .key-btn {
            width: 36px;
            height: 40px;
            background: #ffffff;
            border: 2px solid #e0c097;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: #3e2723;
            cursor: pointer;
            box-shadow: 0 3px 0 #b8860b;
            transition: all 0.1s;
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b8860b;
        }

        .key-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #2e7d32;
            box-shadow: 0 3px 0 #1b5e20;
            cursor: not-allowed;
        }

        .key-btn.wrong {
            background: #e53935;
            color: white;
            border-color: #b71c1c;
            box-shadow: 0 3px 0 #7f0000;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .message {
            font-size: 1.1rem;
            font-weight: 900;
            min-height: 28px;
            text-align: center;
        }

        .restart-btn {
            background: linear-gradient(180deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #1b5e20;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <a href="./index.html" class="back-btn">⬅ بازگشت</a>
            <div class="title">حدس کلمات</div>
        </div>

        <div class="svg-container">
            <svg class="hangman-svg" viewBox="0 0 64 64" fill="none" stroke="#5d4037" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <!-- چوبه دار -->
                <line x1="12" y1="56" x2="36" y2="56" />
                <line x1="20" y1="56" x2="20" y2="12" />
                <line x1="20" y1="12" x2="42" y2="12" />
                <line x1="42" y1="12" x2="42" y2="20" />
                
                <!-- اجزای آدمک -->
                <circle id="part-0" class="part" cx="42" cy="25" r="5" style="display:none;" />
                <line id="part-1" class="part" x1="42" y1="30" x2="42" y2="42" style="display:none;" />
                <line id="part-2" class="part" x1="42" y1="34" x2="36" y2="39" style="display:none;" />
                <line id="part-3" class="part" x1="42" y1="34" x2="48" y2="39" style="display:none;" />
                <line id="part-4" class="part" x1="42" y1="42" x2="37" y2="50" style="display:none;" />
                <line id="part-5" class="part" x1="42" y1="42" x2="47" y2="50" style="display:none;" />
            </svg>
        </div>

        <div class="category" id="category">دسته‌بندی: ...</div>
        <div class="word-display" id="word-display"></div>
        <div class="message" id="message"></div>
        <div class="keyboard" id="keyboard"></div>

        <button class="restart-btn" id="restart-btn" onclick="initGame()">بازی جدید 🔄</button>
    </div>

    <script>
        const wordsList = [
            { word: 'ایران', cat: 'کشور' },
            { word: 'فردوسی', cat: 'شاعر نامدار' },
            { word: 'سیب', cat: 'میوه' },
            { word: 'تهران', cat: 'پایتخت' },
            { word: 'خورشید', cat: 'طبیعت' },
            { word: 'کامپیوتر', cat: 'تکنولوژی' },
            { word: 'کهکشان', cat: 'فضا' }
        ];

        const faLetters = ['آ','ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];

        let selectedWord = '';
        let guessedLetters = [];
        let wrongGuesses = 0;
        const maxWrong = 6;

        function initGame() {
            const randomItem = wordsList[Math.floor(Math.random() * wordsList.length)];
            selectedWord = randomItem.word;
            document.getElementById('category').textContent = `دسته‌بندی: ${randomItem.cat}`;
            
            guessedLetters = [];
            wrongGuesses = 0;
            document.getElementById('message').textContent = '';
            document.getElementById('message').style.color = '#3e2723';

            // مخفی کردن تمام بخش‌های آدمک
            for (let i = 0; i < maxWrong; i++) {
                document.getElementById(`part-${i}`).style.display = 'none';
            }

            renderWord();
            renderKeyboard();
        }

        function renderWord() {
            const display = document.getElementById('word-display');
            display.innerHTML = '';
            for (let char of selectedWord) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                if (guessedLetters.includes(char) || char === ' ') {
                    box.textContent = char;
                } else {
                    box.textContent = '';
                }
                display.appendChild(box);
            }
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            faLetters.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'key-btn';
                btn.textContent = letter;
                btn.onclick = () => handleGuess(letter, btn);
                kb.appendChild(btn);
            });
        }

        function handleGuess(letter, btn) {
            if (guessedLetters.includes(letter) || wrongGuesses >= maxWrong) return;

            guessedLetters.push(letter);

            if (selectedWord.includes(letter)) {
                btn.classList.add('correct');
                renderWord();
                checkWin();
            } else {
                btn.classList.add('wrong');
                document.getElementById(`part-${wrongGuesses}`).style.display = 'block';
                wrongGuesses++;
                checkLoss();
            }
        }

        function checkWin() {
            const isWon = [...selectedWord].every(char => guessedLetters.includes(char) || char === ' ');
            if (isWon) {
                const msg = document.getElementById('message');
                msg.textContent = '🎉 آفرین! درست حدس زدی!';
                msg.style.color = '#2e7d32';
                disableKeyboard();
            }
        }

        function checkLoss() {
            if (wrongGuesses >= maxWrong) {
                const msg = document.getElementById('message');
                msg.textContent = `باختی! کلمه: ${selectedWord}`;
                msg.style.color = '#e53935';
                disableKeyboard();
            }
        }

        function disableKeyboard() {
            const btns = document.querySelectorAll('.key-btn');
            btns.forEach(b => b.disabled = true);
        }

        initGame();
    </script>
</body>
</html>
