<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Mensch (منچ) - Human vs Bot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

    body {
      font-family: 'Fredoka', sans-serif;
      background: radial-gradient(circle at center, #1e293b, #0f172a);
      user-select: none;
    }

    /* Classic Mensch Board Container */
    .board-container {
      background: linear-gradient(135deg, #7a4a24, #4a2c17 50%, #6b4023);
      padding: 14px !important;
      border-radius: 28px;
      box-shadow: inset 0 0 0 3px #a97142, inset 0 0 25px rgba(0,0,0,.6), 0 25px 50px rgba(0,0,0,.7);
      position: relative;
    }
    .board-container svg { border-radius: 16px; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3D Dice Styling */
    .dice-container {
      perspective: 600px;
    }

    .dice {
      width: 60px;
      height: 60px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1.25);
    }

    .dice-face {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 6px;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.15);
    }

    .dot {
      background-color: #1e293b;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
      width: 10px;
      height: 10px;
    }

    /* Face Orientations */
    .face-1 { transform: rotateY(0deg) translateZ(30px); }
    .face-6 { transform: rotateY(180deg) translateZ(30px); }
    .face-2 { transform: rotateY(-90deg) translateZ(30px); }
    .face-5 { transform: rotateY(90deg) translateZ(30px); }
    .face-3 { transform: rotateX(90deg) translateZ(30px); }
    .face-4 { transform: rotateX(-90deg) translateZ(30px); }

    /* Dot Layouts */
    .face-1 .dot:nth-child(1) { grid-area: 2 / 2; background-color: #dc2626; width: 14px; height: 14px; }
    .face-2 .dot:nth-child(1) { grid-area: 1 / 1; } .face-2 .dot:nth-child(2) { grid-area: 3 / 3; }
    .face-3 .dot:nth-child(1) { grid-area: 1 / 1; } .face-3 .dot:nth-child(2) { grid-area: 2 / 2; } .face-3 .dot:nth-child(3) { grid-area: 3 / 3; }
    .face-4 .dot:nth-child(1) { grid-area: 1 / 1; } .face-4 .dot:nth-child(2) { grid-area: 1 / 3; } .face-4 .dot:nth-child(3) { grid-area: 3 / 1; } .face-4 .dot:nth-child(4) { grid-area: 3 / 3; }
    .face-5 .dot:nth-child(1) { grid-area: 1 / 1; } .face-5 .dot:nth-child(2) { grid-area: 1 / 3; } .face-5 .dot:nth-child(3) { grid-area: 2 / 2; } .face-5 .dot:nth-child(4) { grid-area: 3 / 1; } .face-5 .dot:nth-child(5) { grid-area: 3 / 3; }
    .face-6 .dot:nth-child(1) { grid-area: 1 / 1; } .face-6 .dot:nth-child(2) { grid-area: 2 / 1; } .face-6 .dot:nth-child(3) { grid-area: 3 / 1; } .face-6 .dot:nth-child(4) { grid-area: 1 / 3; } .face-6 .dot:nth-child(5) { grid-area: 2 / 3; } .face-6 .dot:nth-child(6) { grid-area: 3 / 3; }

    /* Pawns, glow & effects */
    .pawn { cursor: default; }
    .pawn.selectable { cursor: pointer; }
    .pawn .ring { display: none; transform-box: fill-box; transform-origin: center; }
    .pawn.selectable .ring { display: inline; animation: ringPulse .9s infinite alternate ease-in-out; }
    .pawn.selectable .body { animation: bob .7s infinite alternate ease-in-out; }
    @keyframes ringPulse { from { transform: scale(.85); opacity: .6; } to { transform: scale(1.15); opacity: 1; } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
    .nest-base.active { animation: nestPulse 1.1s infinite alternate ease-in-out; }
    @keyframes nestPulse { from { fill-opacity: .3; } to { fill-opacity: .6; } }
    .dice-tilt { transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(-30deg); }
    .dice-shadow { width: 56px; height: 10px; border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(4px); margin-top: -4px; }

    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between overflow-x-hidden p-2 sm:p-4">

  <!-- Header Navigation -->
  <header class="w-full max-w-4xl mx-auto flex items-center justify-between py-2 px-4 mb-2">
    <!-- Red Home Button (Links to index.html) -->
    <a href="index.html" class="flex items-center gap-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-2 px-4 rounded-xl shadow-lg hover:shadow-red-500/30 transition-all duration-200 border border-red-400/30 active:scale-95">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="hidden sm:inline">Home</span>
    </a>

    <!-- Game Title -->
    <div class="text-center">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider bg-gradient-to-r from-red-400 via-yellow-300 to-blue-400 bg-clip-text text-transparent">
        CLASSIC MENSCH (منچ)
      </h1>
      <p class="text-xs text-slate-400 font-semibold">HUMAN (RED) VS BOT (BLUE)</p>
    </div>

    <!-- Mute / Sound toggle -->
    <button id="audio-toggle" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2 px-3.5 rounded-xl border border-slate-700 transition-all">
      <i id="audio-icon" class="fa-solid fa-volume-high text-lg"></i>
    </button>
  </header>

  <!-- Main Game Layout -->
  <main class="w-full max-w-4xl mx-auto flex flex-col lg:flex-row items-center justify-center gap-6 my-auto">
    
    <!-- Authentic Mensch Board SVG -->
    <div class="w-full max-w-[500px] aspect-square board-container p-2 sm:p-3 flex items-center justify-center relative">
      <svg id="mensch-svg" viewBox="0 0 1000 1000"></svg>
    </div>

    <!-- Dashboard & Controls -->
    <div class="w-full max-w-[500px] lg:w-80 flex flex-col gap-4">
      
      <!-- Current Status & Player Turn Panel -->
      <div class="glass-card rounded-2xl p-4 flex flex-col gap-3">
        <div class="flex items-center justify-between pb-2 border-b border-slate-700/60">
          <span class="text-xs font-semibold uppercase tracking-widest text-slate-400">Current Turn</span>
          <span id="turn-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-400 border border-red-500/30">
            YOUR TURN (RED)
          </span>
        </div>
        
        <!-- Status Box -->
        <div class="bg-slate-950/60 rounded-xl p-3 border border-slate-800 text-center min-h-[60px] flex items-center justify-center">
          <p id="status-text" class="text-sm font-medium text-slate-200 leading-snug">
            Roll a 6 to bring a token out onto the board!
          </p>
        </div>
      </div>

      <!-- Interactive 3D Dice Box -->
      <div class="glass-card rounded-2xl p-6 flex flex-col items-center justify-center gap-4">
        <div id="dice-box" class="dice-container py-2">
          <div class="dice-tilt">
          <div id="dice" class="dice">
            <div class="dice-face face-1"><div class="dot"></div></div>
            <div class="dice-face face-2"><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="dice-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
          </div></div>
        </div>
        <div id="dice-shadow" class="dice-shadow"></div>

        <button id="roll-btn" class="w-full py-3.5 px-6 rounded-xl font-extrabold text-white text-base tracking-wide bg-gradient-to-r from-red-600 via-red-500 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-95 shadow-lg shadow-red-600/30 transition-all duration-150 disabled:opacity-40 disabled:pointer-events-none disabled:shadow-none flex items-center justify-center gap-2">
          <i class="fa-solid fa-dice text-xl"></i>
          <span>ROLL DICE</span>
        </button>
      </div>

      <!-- Game Progress -->
      <div class="glass-card rounded-2xl p-4 grid grid-cols-2 gap-3">
        <!-- Red Player Stats -->
        <div class="bg-red-950/30 border border-red-800/40 rounded-xl p-3 flex flex-col items-center">
          <div class="flex items-center gap-2 mb-1">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <span class="text-xs font-bold text-red-300">YOU (RED)</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span id="red-home-count" class="text-2xl font-black text-red-400">0</span>
            <span class="text-xs text-slate-400">/ 4 Home</span>
          </div>
        </div>

        <!-- Blue Player Stats -->
        <div class="bg-blue-950/30 border border-blue-800/40 rounded-xl p-3 flex flex-col items-center">
          <div class="flex items-center gap-2 mb-1">
            <div class="w-3 h-3 rounded-full bg-blue-500"></div>
            <span class="text-xs font-bold text-blue-300">BOT (BLUE)</span>
          </div>
          <div class="flex items-baseline gap-1">
            <span id="blue-home-count" class="text-2xl font-black text-blue-400">0</span>
            <span class="text-xs text-slate-400">/ 4 Home</span>
          </div>
        </div>
      </div>

      <button id="reset-btn" class="w-full py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 transition-all">
        <i class="fa-solid fa-rotate-right mr-1.5"></i> Restart Game
      </button>

    </div>
  </main>

  <footer class="w-full text-center py-2 text-xs text-slate-500">
    Authentic Mensch (منچ) Game &bull; Web Audio API Synthesizer & SVG Rendering
  </footer>

  <!-- Victory Overlay Modal -->
  <div id="victory-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl">
      <div id="victory-icon-bg" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 bg-red-500/20 text-red-400">
        <i id="victory-icon" class="fa-solid fa-trophy text-4xl"></i>
      </div>
      <h2 id="victory-title" class="text-3xl font-black mb-2 text-white">VICTORY!</h2>
      <p id="victory-msg" class="text-sm text-slate-300 mb-6">Congratulations! You defeated the Bot.</p>
      <button id="modal-restart-btn" class="w-full py-3 px-6 rounded-xl font-bold bg-gradient-to-r from-red-600 to-red-500 text-white shadow-lg hover:from-red-500 hover:to-red-400 transition-all">
        Play Again
      </button>
    </div>
  </div>

  <script>
    /**
     * Web Audio API Synthesizer
     */
    class SoundController {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playDiceRoll() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        for (let i = 0; i < 6; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(160 + Math.random() * 220, now + i * 0.05);
          gain.gain.setValueAtTime(0.08, now + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.05);
          osc.stop(now + i * 0.05 + 0.04);
        }
      }

      playStep() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
      }

      playCapture() {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.28);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.28);
      }

      playHome() {
        if (this.muted) return;
        this.init();
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.15);
        });
      }

      playVictory() {
        if (this.muted) return;
        this.init();
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.12 + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.12);
          osc.stop(this.ctx.currentTime + idx * 0.12 + 0.3);
        });
      }
    }

    const sound = new SoundController();

    /**
     * Exact Authentic Mensch Geometry (11x11 Grid Matrix mapping into 1000x1000 SVG Canvas)
     */
    const SPOT_RADIUS = 30;
    const COLOR_MAP = {
      red: '#dc2626',
      blue: '#2563eb',
      green: '#16a34a',
      yellow: '#ca8a04',
      white: '#ffffff',
      border: '#000000'
    };

    function gridToSvg(x, y) {
      const margin = 80;
      const step = (1000 - margin * 2) / 10;
      return {
        cx: margin + x * step,
        cy: margin + y * step
      };
    }

    // 40 Circuit Track Spots around the classic Mensch cross
    const MAIN_CIRCUIT_GRID = [
      [4, 10], [4, 9], [4, 8], [4, 7], [4, 6],   // Bottom Left up to center
      [3, 6], [2, 6], [1, 6], [0, 6],          // Left arm lower
      [0, 5],                                  // Leftmost peak
      [0, 4], [1, 4], [2, 4], [3, 4], [4, 4],   // Left arm upper to center
      [4, 3], [4, 2], [4, 1], [4, 0],          // Top arm left
      [5, 0],                                  // Topmost peak
      [6, 0], [6, 1], [6, 2], [6, 3], [6, 4],   // Top arm right to center
      [7, 4], [8, 4], [9, 4], [10, 4],         // Right arm upper
      [10, 5],                                 // Rightmost peak
      [10, 6], [9, 6], [8, 6], [7, 6], [6, 6], // Right arm lower to center
      [6, 7], [6, 8], [6, 9], [6, 10],         // Bottom arm right
      [5, 10]                                  // Bottommost peak
    ];

    // Home Stretch Columns
    const HOME_PATHS_GRID = {
      red: [[5, 9], [5, 8], [5, 7], [5, 6]],
      blue: [[5, 1], [5, 2], [5, 3], [5, 4]],
      green: [[1, 5], [2, 5], [3, 5], [4, 5]],
      yellow: [[9, 5], [8, 5], [7, 5], [6, 5]]
    };

    // Starting Nests
    const NESTS_GRID = {
      red: [[0, 9], [1, 9], [0, 10], [1, 10]],
      blue: [[9, 0], [10, 0], [9, 1], [10, 1]],
      green: [[0, 0], [1, 0], [0, 1], [1, 1]],
      yellow: [[9, 9], [10, 9], [9, 10], [10, 10]]
    };

    const PLAYER_START_INDEX = {
      red: 0,      // Grid [4, 10]
      green: 10,   // Grid [0, 4]
      blue: 20,    // Grid [6, 0]
      yellow: 30   // Grid [10, 6]
    };

    // Game State & Consecutive 6 Control Tracker
    let gameState = {
      turn: 'red',
      diceValue: 0,
      canRoll: true,
      awaitingMove: false,
      consecutiveSixes: { red: 0, blue: 0 },
      pieces: {
        red: [{ id: 0, state: 'nest', pos: -1 }, { id: 1, state: 'nest', pos: -1 }, { id: 2, state: 'nest', pos: -1 }, { id: 3, state: 'nest', pos: -1 }],
        blue: [{ id: 0, state: 'nest', pos: -1 }, { id: 1, state: 'nest', pos: -1 }, { id: 2, state: 'nest', pos: -1 }, { id: 3, state: 'nest', pos: -1 }]
      }
    };

    /**
     * Balanced & Natural Dice Roll Algorithm
     * Gives ~20% probability for 6, preventing repetitive consecutive 6s
     */
    function getRandomDiceValue(player) {
      // If player already rolled 6 consecutively, prevent another 6
      if (gameState.consecutiveSixes[player] >= 1) {
        return Math.floor(Math.random() * 5) + 1; // Pick 1-5 only
      }

      // 20% natural probability for 6
      const rand = Math.random();
      if (rand < 0.20) {
        return 6;
      } else {
        return Math.floor(Math.random() * 5) + 1; // Pick 1-5
      }
    }

    const NS = 'http://www.w3.org/2000/svg';
    const $ = id => document.getElementById(id);
    const COLORS = ['red', 'blue', 'green', 'yellow'];
    const PAL = {
      red:    { l: '#fca5a5', m: '#dc2626', d: '#7f1d1d' },
      blue:   { l: '#93c5fd', m: '#2563eb', d: '#1e3a8a' },
      green:  { l: '#86efac', m: '#16a34a', d: '#14532d' },
      yellow: { l: '#fde68a', m: '#eab308', d: '#854d0e' }
    };
    const rollBtn = $('roll-btn'), diceEl = $('dice'), statusText = $('status-text'), turnBadge = $('turn-badge');
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const who = c => (c === 'red' ? 'You' : 'Bot');
    let epoch = 0;            // bumped on restart so stale timers/animations stop
    let pawnEls = { red: [], blue: [] };

    function newState() {
      const mk = () => [0, 1, 2, 3].map(id => ({ id, state: 'nest', pos: -1 }));
      return { turn: 'red', diceValue: 0, canRoll: true, awaitingMove: false, gameOver: false, tries: 0,
               consecutiveSixes: { red: 0, blue: 0 }, pieces: { red: mk(), blue: mk() } };
    }

    function posCoords(color, pos) {
      if (pos < 40) return gridToSvg(...MAIN_CIRCUIT_GRID[(PLAYER_START_INDEX[color] + pos) % 40]);
      return gridToSvg(...HOME_PATHS_GRID[color][pos - 40]);
    }
    function pieceCoords(color, p) {
      return p.state === 'nest' ? gridToSvg(...NESTS_GRID[color][p.id]) : posCoords(color, p.pos);
    }

    /* ---------- Board drawing ---------- */
    function renderSvgBoard() {
      let defs = `<defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8cfa3"/><stop offset=".5" stop-color="#d4b283"/><stop offset="1" stop-color="#dcbd8e"/></linearGradient>
        <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.18" numOctaves="3" seed="7"/><feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0 0.08  0 0 0 0.9 -0.25"/></filter>
        <radialGradient id="hole" cx=".5" cy=".4" r=".65"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#d8c39b"/></radialGradient>
        <radialGradient id="pit" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#6b4423"/><stop offset="1" stop-color="#3b2412"/></radialGradient>`;
      COLORS.forEach(c => {
        const p = PAL[c];
        defs += `<linearGradient id="pg-${c}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${p.l}"/><stop offset=".45" stop-color="${p.m}"/><stop offset="1" stop-color="${p.d}"/></linearGradient>
                 <radialGradient id="ph-${c}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="${p.l}"/><stop offset=".5" stop-color="${p.m}"/><stop offset="1" stop-color="${p.d}"/></radialGradient>`;
      });
      defs += '</defs>';

      const circ = MAIN_CIRCUIT_GRID.map(g => gridToSvg(...g));
      let back = `<rect x="6" y="6" width="988" height="988" rx="34" fill="url(#wood)"/>
        <rect x="6" y="6" width="988" height="988" rx="34" filter="url(#grain)" opacity=".5"/>
        <rect x="22" y="22" width="956" height="956" rx="26" fill="none" stroke="#8b5e34" stroke-opacity=".45" stroke-width="3"/>`;

      COLORS.forEach(c => {
        const p = PAL[c], n = NESTS_GRID[c].map(g => gridToSvg(...g));
        const xs = n.map(q => q.cx), ys = n.map(q => q.cy);
        back += `<rect class="nest-base" data-c="${c}" x="${Math.min(...xs) - 52}" y="${Math.min(...ys) - 52}" width="${Math.max(...xs) - Math.min(...xs) + 104}" height="${Math.max(...ys) - Math.min(...ys) + 104}" rx="34" fill="${p.m}" fill-opacity=".3" stroke="${p.m}" stroke-width="6"/>`;
        n.forEach(q => back += `<circle cx="${q.cx}" cy="${q.cy}" r="36" fill="url(#pit)" stroke="${p.d}" stroke-width="4"/>`);
      });

      back += `<path d="M${circ.map(q => q.cx + ' ' + q.cy).join('L')}Z" fill="none" stroke="#7a4f28" stroke-opacity=".28" stroke-width="60" stroke-linejoin="round"/>`;
      COLORS.forEach(c => {
        const h = HOME_PATHS_GRID[c].map(g => gridToSvg(...g));
        back += `<path d="M${h.map(q => q.cx + ' ' + q.cy).join('L')}" fill="none" stroke="${PAL[c].m}" stroke-opacity=".35" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>`;
      });

      let spots = '';
      circ.forEach((q, i) => {
        const c = COLORS.find(k => PLAYER_START_INDEX[k] === i);
        spots += c
          ? `<circle cx="${q.cx}" cy="${q.cy}" r="31" fill="${PAL[c].l}" stroke="${PAL[c].m}" stroke-width="9"/><circle cx="${q.cx}" cy="${q.cy}" r="12" fill="${PAL[c].m}" fill-opacity=".5"/>`
          : `<circle cx="${q.cx}" cy="${q.cy}" r="30" fill="url(#hole)" stroke="#4a2c17" stroke-width="4"/>`;
      });
      COLORS.forEach(c => HOME_PATHS_GRID[c].forEach((g, i) => {
        const q = gridToSvg(...g);
        spots += `<circle cx="${q.cx}" cy="${q.cy}" r="27" fill="url(#hole)" stroke="${PAL[c].m}" stroke-width="7"/>
                  <text x="${q.cx}" y="${q.cy}" dy=".35em" text-anchor="middle" font-size="22" font-weight="700" fill="${PAL[c].d}" opacity=".6">${i + 1}</text>`;
      }));
      const tri = { red: '474,536 526,536', blue: '474,464 526,464', green: '464,474 464,526', yellow: '536,474 536,526' };
      spots += '<circle cx="500" cy="500" r="46" fill="#f8efd9" stroke="#4a2c17" stroke-width="5"/>';
      COLORS.forEach(c => spots += `<polygon points="500,500 ${tri[c]}" fill="${PAL[c].m}" stroke="${PAL[c].m}" stroke-width="3" stroke-linejoin="round"/>`);

      $('mensch-svg').innerHTML = defs + `<g id="svg-connections">${back}</g><g id="svg-spots">${spots}</g><g id="svg-ghost"></g><g id="svg-pawns"></g><g id="svg-fx"></g>`;
    }

    /* ---------- Pawns ---------- */
    function pawnSvg(c) {
      const p = PAL[c];
      return `<circle class="ring" r="42" fill="rgba(250,204,21,.18)" stroke="#facc15" stroke-width="5"/>
        <ellipse cx="0" cy="16" rx="24" ry="8" fill="rgba(0,0,0,.35)"/>
        <g transform="translate(0,-4)"><g class="body">
          <ellipse cx="0" cy="20" rx="22" ry="6" fill="${p.d}"/>
          <path d="M-22 20Q-22 14-14 12Q-8 4-6-6L6-6Q8 4 14 12Q22 14 22 20Z" fill="url(#pg-${c})" stroke="${p.d}" stroke-width="2"/>
          <circle cx="0" cy="-14" r="13" fill="url(#ph-${c})" stroke="${p.d}" stroke-width="2"/>
          <ellipse cx="-4" cy="-19" rx="4.5" ry="3" fill="#fff" opacity=".55"/>
        </g></g>
        <circle r="42" fill="transparent"/>`;
    }
    const setPos = (g, q) => { g.style.transform = `translate(${q.cx}px,${q.cy}px)`; };

    function buildPawns() {
      const grp = $('svg-pawns');
      grp.innerHTML = '';
      pawnEls = { red: [], blue: [] };
      ['red', 'blue'].forEach(c => gameState.pieces[c].forEach(p => {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'pawn');
        g.innerHTML = pawnSvg(c);
        g.addEventListener('click', () => onPawnClick(c, p));
        g.addEventListener('mouseenter', () => showGhost(c, p));
        g.addEventListener('mouseleave', hideGhost);
        setPos(g, pieceCoords(c, p));
        grp.appendChild(g);
        pawnEls[c][p.id] = g;
      }));
    }

    function markSelectable() {
      const gs = gameState;
      pawnEls.red.forEach((g, i) => g.classList.toggle('selectable',
        gs.awaitingMove && gs.turn === 'red' && canMovePiece('red', gs.pieces.red[i], gs.diceValue)));
    }
    function showGhost(c, p) {
      const gs = gameState;
      if (c !== 'red' || !gs.awaitingMove || !canMovePiece(c, p, gs.diceValue)) return;
      const q = posCoords('red', p.state === 'nest' ? 0 : p.pos + gs.diceValue);
      $('svg-ghost').innerHTML = `<circle cx="${q.cx}" cy="${q.cy}" r="30" fill="rgba(250,204,21,.25)" stroke="#facc15" stroke-width="4" stroke-dasharray="8 6"/>`;
    }
    function hideGhost() { $('svg-ghost').innerHTML = ''; }

    /* ---------- Effects ---------- */
    function burst(q, color) {
      const fx = $('svg-fx');
      const ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('cx', q.cx); ring.setAttribute('cy', q.cy); ring.setAttribute('r', 20);
      ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', color); ring.setAttribute('stroke-width', 6);
      ring.style.cssText = 'transform-box:fill-box;transform-origin:center';
      fx.appendChild(ring);
      ring.animate([{ transform: 'scale(.5)', opacity: 1 }, { transform: 'scale(3)', opacity: 0 }], { duration: 500, easing: 'ease-out' }).onfinish = () => ring.remove();
      for (let i = 0; i < 12; i++) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', q.cx); c.setAttribute('cy', q.cy); c.setAttribute('r', 5 + Math.random() * 5); c.setAttribute('fill', color);
        fx.appendChild(c);
        const a = (i / 12) * Math.PI * 2, d = 50 + Math.random() * 40;
        c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }], { duration: 600, easing: 'ease-out' }).onfinish = () => c.remove();
      }
    }

    function confetti() {
      const w = document.createElement('div');
      w.id = 'confetti';
      w.className = 'fixed inset-0 pointer-events-none z-[60] overflow-hidden';
      for (let i = 0; i < 80; i++) {
        const s = document.createElement('i');
        s.style.cssText = `position:absolute;top:-20px;left:${Math.random() * 100}%;width:${6 + Math.random() * 6}px;height:${10 + Math.random() * 8}px;background:hsl(${Math.random() * 360} 90% 60%)`;
        s.animate([{ transform: 'translateY(0) rotate(0)' }, { transform: `translateY(${innerHeight + 40}px) rotate(${360 + Math.random() * 720}deg)` }],
          { duration: 2500 + Math.random() * 2000, delay: Math.random() * 800, fill: 'forwards', easing: 'ease-in' });
        w.appendChild(s);
      }
      document.body.appendChild(w);
      setTimeout(() => w.remove(), 6000);
    }

    /* ---------- Dice ---------- */
    const FACE = { 1: [0, 0], 6: [0, 180], 2: [0, 90], 5: [0, -90], 3: [-90, 0], 4: [90, 0] };
    const spin = { x: 0, y: 0 };
    function animateDice(v) {
      spin.x += 360 * (2 + Math.floor(Math.random() * 2));
      spin.y += 360 * (2 + Math.floor(Math.random() * 2));
      diceEl.style.transform = `rotateX(${spin.x + FACE[v][0]}deg) rotateY(${spin.y + FACE[v][1]}deg)`;
      $('dice-box').animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-28px)', offset: .3 }, { transform: 'translateY(0)', offset: .6 }, { transform: 'translateY(-8px)', offset: .8 }, { transform: 'translateY(0)' }], { duration: 700 });
      $('dice-shadow').animate([{ transform: 'scale(1)' }, { transform: 'scale(.6)', offset: .3 }, { transform: 'scale(1)', offset: .6 }, { transform: 'scale(.85)', offset: .8 }, { transform: 'scale(1)' }], { duration: 700 });
    }

    /* ---------- Rules ---------- */
    function ownAt(color, pos, exceptId) {
      return gameState.pieces[color].some(p => p.state === 'active' && p.pos === pos && p.id !== exceptId);
    }
    // A piece can't land on one of its own pieces (also blocks leaving the nest while your start square is taken).
    function canMovePiece(color, p, dice) {
      if (gameState.gameOver) return false;
      if (p.state === 'nest') return dice === 6 && !ownAt(color, 0, p.id);
      const t = p.pos + dice;
      return t <= 43 && !ownAt(color, t, p.id);
    }
    function getValidMoves(color, dice) {
      return gameState.pieces[color].filter(p => canMovePiece(color, p, dice));
    }

    async function hop(g, a, b) {
      sound.playStep();
      g.querySelector('.body').animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-20px)', offset: .5 }, { transform: 'translateY(0)' }], { duration: 190, easing: 'ease-out' });
      const A = `translate(${a.cx}px,${a.cy}px)`;
      setPos(g, b);
      await g.animate([{ transform: A }, { transform: `translate(${b.cx}px,${b.cy}px)` }], { duration: 190, easing: 'linear' }).finished.catch(() => {});
    }

    async function doMove(color, piece, dice) {
      const e = epoch, g = pawnEls[color][piece.id], opp = color === 'red' ? 'blue' : 'red';
      let from = pieceCoords(color, piece);
      const path = [];
      if (piece.state === 'nest') {
        piece.state = 'active'; piece.pos = 0;
        path.push(posCoords(color, 0));
      } else {
        for (let k = 1; k <= dice; k++) path.push(posCoords(color, piece.pos + k));
        piece.pos += dice;
      }
      g.parentNode.appendChild(g); // draw on top
      for (const to of path) {
        await hop(g, from, to);
        from = to;
        if (e !== epoch) return;
      }

      if (piece.pos < 40) {
        const ci = (PLAYER_START_INDEX[color] + piece.pos) % 40;
        for (const o of gameState.pieces[opp]) {
          if (o.state === 'active' && o.pos < 40 && (PLAYER_START_INDEX[opp] + o.pos) % 40 === ci) {
            const oFrom = pieceCoords(opp, o);
            o.state = 'nest'; o.pos = -1;
            const oTo = pieceCoords(opp, o), og = pawnEls[opp][o.id];
            burst(oFrom, PAL[opp].m);
            sound.playCapture();
            updateStatus(color === 'red' ? 'BOOM! You captured a Blue pawn!' : 'Ouch! The Bot captured your Red pawn!');
            og.parentNode.appendChild(og);
            setPos(og, oTo);
            await og.animate([{ transform: `translate(${oFrom.cx}px,${oFrom.cy}px)` }, { transform: `translate(${oTo.cx}px,${oTo.cy}px)` }], { duration: 500, easing: 'ease-in-out' }).finished.catch(() => {});
            if (e !== epoch) return;
          }
        }
      } else {
        sound.playHome();
        burst(from, '#facc15');
      }

      updateCounters();
      const done = c => gameState.pieces[c].every(p => p.pos >= 40);
      if (done('red') || done('blue')) {
        gameState.gameOver = true;
        rollBtn.disabled = true;
        await sleep(600);
        if (e !== epoch) return;
        showVictoryModal(done('red') ? 'human' : 'bot');
      }
    }

    function chooseAiMove(moves, dice) {
      const ci = (c, pos) => (PLAYER_START_INDEX[c] + pos) % 40;
      const reds = gameState.pieces.red.filter(o => o.state === 'active' && o.pos < 40);
      const threatened = idx => reds.some(o => { const d = (idx - ci('red', o.pos) + 40) % 40; return d >= 1 && d <= 6; });
      let best = null, bs = -Infinity;
      for (const p of moves) {
        const t = p.state === 'nest' ? 0 : p.pos + dice;
        let s = Math.random() + t * 0.5;
        if (p.state === 'nest') s += 45;
        if (t < 40) {
          const idx = ci('blue', t);
          if (reds.some(o => ci('red', o.pos) === idx)) s += 100;   // capture
          if (threatened(idx)) s -= 30;                              // don't land in danger
        } else if (p.state === 'active' && p.pos < 40) s += 70;      // reach the home stretch
        if (p.state === 'active' && p.pos < 40 && threatened(ci('blue', p.pos))) s += 35; // run away
        if (s > bs) { bs = s; best = p; }
      }
      return best;
    }

    /* ---------- Turn flow ---------- */
    function updateStatus(msg) { statusText.textContent = msg; }
    function updateCounters() {
      $('red-home-count').textContent = gameState.pieces.red.filter(p => p.pos >= 40).length;
      $('blue-home-count').textContent = gameState.pieces.blue.filter(p => p.pos >= 40).length;
    }
    function setTurnUi() {
      const red = gameState.turn === 'red';
      turnBadge.textContent = red ? 'YOUR TURN (RED)' : 'BOT TURN (BLUE)';
      turnBadge.className = 'px-3 py-1 rounded-full text-xs font-bold border ' + (red ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30');
      document.querySelectorAll('.nest-base').forEach(r => r.classList.toggle('active', r.getAttribute('data-c') === gameState.turn));
    }
    function later(fn, ms) { const e = epoch; setTimeout(() => { if (e === epoch) fn(); }, ms); }

    function endTurn(extra) {
      if (gameState.gameOver) return;
      gameState.tries = 0;
      const c = gameState.turn;
      if (extra) {
        updateStatus(`${c === 'red' ? 'You' : 'Bot'} rolled a 6! Roll again.`);
        gameState.canRoll = true;
        if (c === 'red') rollBtn.disabled = false; else later(rollDice, 1000);
        return;
      }
      gameState.turn = c === 'red' ? 'blue' : 'red';
      gameState.canRoll = true;
      setTurnUi();
      if (gameState.turn === 'red') { rollBtn.disabled = false; updateStatus('Your turn! Roll the dice.'); }
      else { rollBtn.disabled = true; updateStatus('Bot is rolling...'); later(rollDice, 1000); }
    }

    async function rollDice() {
      if (!gameState.canRoll || gameState.gameOver) return;
      const e = epoch, color = gameState.turn;
      gameState.canRoll = false;
      rollBtn.disabled = true;
      sound.playDiceRoll();
      const v = getRandomDiceValue(color);
      gameState.diceValue = v;
      gameState.consecutiveSixes[color] = v === 6 ? gameState.consecutiveSixes[color] + 1 : 0;
      animateDice(v);
      await sleep(750);
      if (e !== epoch) return;
      await afterRoll(color, v, e);
    }

    async function afterRoll(color, v, e) {
      const moves = getValidMoves(color, v), ps = gameState.pieces[color];
      updateStatus(`${who(color)} rolled a ${v}!`);
      if (!moves.length) {
        // Classic rule: with every pawn in the nest you get 3 tries to roll a 6
        const allNest = ps.every(p => p.state === 'nest' || p.pos >= 40) && ps.some(p => p.state === 'nest');
        await sleep(900);
        if (e !== epoch) return;
        if (allNest && v !== 6 && gameState.tries < 2) {
          gameState.tries++;
          updateStatus(`No 6 yet — try ${gameState.tries + 1} of 3.`);
          gameState.canRoll = true;
          if (color === 'red') rollBtn.disabled = false; else later(rollDice, 700);
          return;
        }
        updateStatus(`No valid moves for ${color === 'red' ? 'you' : 'the Bot'}.`);
        await sleep(700);
        if (e !== epoch) return;
        endTurn(v === 6);
        return;
      }
      if (color === 'red') {
        gameState.awaitingMove = true;
        markSelectable();
        updateStatus(`You rolled a ${v}. Tap a glowing pawn to move it.`);
        return;
      }
      await sleep(800);
      if (e !== epoch) return;
      await doMove('blue', chooseAiMove(moves, v), v);
      if (e !== epoch) return;
      endTurn(v === 6);
    }

    async function onPawnClick(color, piece) {
      const gs = gameState;
      if (color !== 'red' || gs.turn !== 'red' || !gs.awaitingMove || !canMovePiece('red', piece, gs.diceValue)) return;
      const e = epoch, v = gs.diceValue;
      gs.awaitingMove = false;
      markSelectable();
      hideGhost();
      await doMove('red', piece, v);
      if (e !== epoch) return;
      endTurn(v === 6);
    }

    function showVictoryModal(winner) {
      const iconBg = $('victory-icon-bg');
      sound.playVictory();
      if (winner === 'human') {
        $('victory-title').textContent = 'YOU WON!';
        $('victory-msg').textContent = 'Excellent strategy! You completed all 4 tokens.';
        iconBg.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 bg-red-500/20 text-red-400 border border-red-500/40';
        confetti();
      } else {
        $('victory-title').textContent = 'BOT WON!';
        $('victory-msg').textContent = 'The Blue Bot finished first. Try another game!';
        iconBg.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 bg-blue-500/20 text-blue-400 border border-blue-500/40';
      }
      $('victory-modal').classList.remove('hidden');
    }

    function resetGame() {
      epoch++;
      gameState = newState();
      $('victory-modal').classList.add('hidden');
      const cf = $('confetti'); if (cf) cf.remove();
      $('svg-fx').innerHTML = '';
      hideGhost();
      buildPawns();
      updateCounters();
      setTurnUi();
      rollBtn.disabled = false;
      updateStatus('Roll a 6 to bring a token out onto the board!');
    }

    rollBtn.addEventListener('click', rollDice);
    $('reset-btn').addEventListener('click', resetGame);
    $('modal-restart-btn').addEventListener('click', resetGame);
    document.addEventListener('keydown', ev => {
      if (ev.code === 'Space' && document.activeElement === document.body && !rollBtn.disabled) { ev.preventDefault(); rollDice(); }
    });

    $('audio-toggle').addEventListener('click', () => {
      sound.muted = !sound.muted;
      $('audio-icon').className = sound.muted ? 'fa-solid fa-volume-xmark text-lg text-red-400' : 'fa-solid fa-volume-high text-lg text-slate-200';
    });

    window.onload = () => {
      renderSvgBoard();
      resetGame();
    };
  </script>
</body>
</html>
