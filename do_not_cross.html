<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Do Not Cross</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f172a;color:#e2e8f0;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#home{position:fixed;top:12px;left:12px;z-index:20;display:flex;align-items:center;gap:6px;background:#dc2626;color:#fff;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 4px 12px #0006}
#home:hover{background:#ef4444}
#mute{position:fixed;top:12px;right:12px;z-index:20;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:12px;padding:10px 14px;font-size:16px;cursor:pointer}
h1{margin:0;text-align:center;font-size:28px;letter-spacing:1px}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 16px 16px}
#menu p{margin:0;color:#94a3b8;text-align:center}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:min(480px,100%)}
.lv{aspect-ratio:1;border:0;border-radius:14px;font-size:22px;font-weight:700;cursor:pointer;color:#fff;background:#2563eb;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lv small{font-size:11px;font-weight:400;opacity:.8}
.lv.done{background:#16a34a}
.lv.locked{background:#1e293b;color:#64748b;cursor:not-allowed}
#game{position:absolute;inset:0;display:none;flex-direction:column;padding:64px 10px 10px}
#bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px 8px;flex-wrap:wrap}
#bar b{font-size:18px}
.btn{background:#334155;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn:hover{background:#475569}
#wrap{flex:1;min-height:0;background:#111c33;border:1px solid #1e293b;border-radius:16px;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
#win{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:30}
#win div{background:#1e293b;padding:28px 32px;border-radius:18px;text-align:center;box-shadow:0 10px 40px #000a}
#win h2{margin:0 0 6px;font-size:28px;color:#4ade80}
#win p{margin:0 0 16px;color:#94a3b8}
#win .btn{margin:0 4px;padding:10px 18px;font-size:15px}
#win .main{background:#2563eb}
</style>
</head>
<body>
<a id="home" href="index.html">🏠 Home</a>
<button id="mute" title="Sound on/off">🔊</button>

<div id="menu">
  <h1>🚫 Do Not Cross</h1>
  <p>Drag the dots until no lines cross each other.<br>Solve a level to unlock the next one.</p>
  <div id="grid"></div>
</div>

<div id="game">
  <div id="bar">
    <b id="lvl">Level 1</b>
    <span>Crossings: <b id="cnt">0</b></span>
    <span><button class="btn" id="reset">⟲ Reset</button> <button class="btn" id="back">☰ Levels</button></span>
  </div>
  <div id="wrap"><canvas id="cv"></canvas></div>
</div>

<div id="win"><div>
  <h2>Level Complete!</h2>
  <p id="winmsg">No more crossings.</p>
  <button class="btn" id="again">Replay</button>
  <button class="btn main" id="next">Next Level ▶</button>
</div></div>

<script>
(function(){
const TOTAL=10;
let unlocked=1,muted=false;
try{unlocked=Math.min(TOTAL,Math.max(1,parseInt(localStorage.getItem('dnc_unlocked'))||1));muted=localStorage.getItem('dnc_muted')==='1'}catch(e){}
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
$('mute').textContent=muted?'🔇':'🔊';

/* ---------- audio ---------- */
let ac=null;
function tone(f,d,type,vol,delay){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  pick:()=>tone(520,.08,'triangle',.12),
  drop:()=>tone(330,.1,'triangle',.12),
  fix:()=>tone(880,.12,'sine',.12),
  bad:()=>tone(160,.15,'sawtooth',.08),
  lock:()=>{tone(150,.12,'square',.07);tone(110,.15,'square',.07,.1)},
  click:()=>tone(600,.06,'square',.06),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.16,i*.12))
};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('dnc_muted',muted?'1':'0')}catch(e){};sfx.click()};

/* ---------- level generation ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function orient(a,b,c){return(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
function cross(p,q,r,s){
  if(p===r||p===s||q===r||q===s)return false;
  const d1=orient(p,q,r),d2=orient(p,q,s),d3=orient(r,s,p),d4=orient(r,s,q);
  return d1*d2<0&&d3*d4<0;
}
function makeLevel(L){
  const R=rng(L*7919+13);
  const n=[6,7,8,10,12,14,16,19,23,27][L-1];  // Easy 1-3, Medium 4-7, Hard 8-10
  const dens=1.4+L*.1;                 // more edges on later levels
  const pts=[];
  while(pts.length<n){
    const p={x:.06+R()*.88,y:.06+R()*.88};
    if(pts.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>.09))pts.push(p);
  }
  const cand=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)cand.push([i,j,Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y)]);
  cand.sort((a,b)=>a[2]-b[2]);
  const edges=[],maxE=Math.floor(n*dens);
  for(const [i,j] of cand){
    if(edges.length>=maxE)break;
    if(edges.every(e=>!cross(pts[i],pts[j],pts[e[0]],pts[e[1]])))edges.push([i,j]);
  }
  // scramble onto a circle in random order until it is properly tangled
  let nodes,tries=0;
  do{
    const order=pts.map((_,i)=>i);
    for(let i=n-1;i>0;i--){const k=Math.floor(R()*(i+1));[order[i],order[k]]=[order[k],order[i]]}
    nodes=order.map((_,i)=>{const a=order.indexOf(i)/n*Math.PI*2;return{x:.5+.4*Math.cos(a),y:.5+.4*Math.sin(a)}});
    tries++;
  }while(countCross(nodes,edges)<Math.min(2+L*2,edges.length/2)&&tries<60);
  return{nodes,edges};
}
function countCross(nodes,edges){
  let c=0;
  for(let i=0;i<edges.length;i++)for(let j=i+1;j<edges.length;j++)
    if(cross(nodes[edges[i][0]],nodes[edges[i][1]],nodes[edges[j][0]],nodes[edges[j][1]]))c++;
  return c;
}

/* ---------- game state ---------- */
let cur=1,nodes=[],edges=[],drag=-1,hover=-1,W=0,H=0,dpr=1,bad=new Set(),solved=false,last=0;
function resize(){
  const r=cv.parentElement.getBoundingClientRect();dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
window.addEventListener('resize',()=>{if($('game').style.display==='flex')resize()});

function start(L){
  cur=L;const lv=makeLevel(L);nodes=lv.nodes;edges=lv.edges;solved=false;drag=-1;hover=-1;
  $('lvl').textContent='Level '+L+' / '+TOTAL;
  $('menu').style.display='none';$('game').style.display='flex';$('win').style.display='none';
  resize();update(true);
}
function update(silent){
  bad=new Set();let c=0;
  for(let i=0;i<edges.length;i++)for(let j=i+1;j<edges.length;j++)
    if(cross(nodes[edges[i][0]],nodes[edges[i][1]],nodes[edges[j][0]],nodes[edges[j][1]])){c++;bad.add(i);bad.add(j)}
  if(!silent&&c<last)sfx.fix();else if(!silent&&c>last)sfx.bad();
  last=c;$('cnt').textContent=c;draw();return c;
}
function pos(n){return{x:n.x*W,y:n.y*H}}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';
  edges.forEach((e,i)=>{
    const a=pos(nodes[e[0]]),b=pos(nodes[e[1]]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=bad.has(i)?'#ef4444':'#4ade80';ctx.lineWidth=bad.has(i)?3.5:3;ctx.stroke();
  });
  nodes.forEach((n,i)=>{
    const p=pos(n);ctx.beginPath();ctx.arc(p.x,p.y,i===drag?15:(i===hover?14:12),0,7);
    ctx.fillStyle=i===drag?'#fbbf24':'#f8fafc';ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#2563eb';ctx.stroke();
  });
}
function hit(x,y){
  let best=-1,bd=26;
  nodes.forEach((n,i)=>{const p=pos(n),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=i}});
  return best;
}
function xy(ev){const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
cv.addEventListener('pointerdown',ev=>{
  if(solved)return;const p=xy(ev),i=hit(p.x,p.y);
  if(i>=0){drag=i;cv.setPointerCapture(ev.pointerId);sfx.pick();draw()}
});
cv.addEventListener('pointermove',ev=>{
  const p=xy(ev);
  if(drag>=0){
    nodes[drag].x=Math.min(.97,Math.max(.03,p.x/W));
    nodes[drag].y=Math.min(.95,Math.max(.05,p.y/H));
    update();
  }else{const h=hit(p.x,p.y);if(h!==hover){hover=h;draw()}}
});
function release(){
  if(drag<0)return;drag=-1;sfx.drop();
  if(update(true)===0)win();else draw();
}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);

function win(){
  solved=true;sfx.win();
  if(cur<TOTAL&&cur+1>unlocked){unlocked=cur+1;try{localStorage.setItem('dnc_unlocked',unlocked)}catch(e){}}
  const last=cur===TOTAL;
  $('winmsg').textContent=last?'You finished all 10 levels. Amazing!':'Level '+(cur+1)+' is now unlocked.';
  $('next').style.display=last?'none':'inline-block';
  setTimeout(()=>{$('win').style.display='flex'},350);
}

/* ---------- menu ---------- */
function labelFor(L){return L<=3?'Easy':L<=7?'Medium':'Hard'}
function buildMenu(){
  const g=$('grid');g.innerHTML='';
  for(let L=1;L<=TOTAL;L++){
    const b=document.createElement('button');
    const lock=L>unlocked;
    b.className='lv'+(lock?' locked':(L<unlocked?' done':''));
    b.innerHTML=lock?'🔒<small>Locked</small>':L+'<small>'+(L<unlocked?'✓ ':'')+labelFor(L)+'</small>';
    b.onclick=()=>{if(lock){sfx.lock();return}sfx.click();start(L)};
    g.appendChild(b);
  }
}
function toMenu(){$('game').style.display='none';$('win').style.display='none';$('menu').style.display='flex';buildMenu()}
$('back').onclick=()=>{sfx.click();toMenu()};
$('reset').onclick=()=>{sfx.click();start(cur)};
$('again').onclick=()=>{sfx.click();start(cur)};
$('next').onclick=()=>{sfx.click();start(cur+1)};
buildMenu();
})();
</script>
</body>
</html>
