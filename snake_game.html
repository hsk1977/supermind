<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game - Multi Food</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Fredoka One', cursive;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #00c4e8; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            min-height: 100vh;
            background-color: #00c4e8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        .header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .home-btn {
            background-color: white;
            color: #ff4d4d;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #ccc;
            text-decoration: none;
            transition: transform 0.1s;
        }
        .home-btn:active { transform: translateY(4px); box-shadow: none; }

        .score-board {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background-color: #1a2a3a;
            color: white;
            padding: 6px 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 12px;
            box-shadow: 0 4px 0 #0f1a24;
        }

        .score-box span {
            display: block;
            color: #4cd137;
            font-size: 16px;
            margin-top: 2px;
        }

        .pause-btn {
            background-color: white;
            color: #c0392b;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 0 #ccc;
            transition: transform 0.1s;
        }
        .pause-btn:active { transform: translateY(4px); box-shadow: none; }

        .canvas-wrapper {
            background-color: #1a2a3a;
            padding: 10px;
            border-radius: 15px;
            margin-top: 10px;
        }

        canvas {
            background-color: #ffeaa7; 
            border-radius: 5px;
            display: block;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
        }

        .overlay h1 {
            font-size: 40px;
            color: #ff4d4d;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }

        .diff-btn {
            background-color: #4cd137;
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 8px;
            font-size: 18px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2e8b1e;
            width: 200px;
            transition: transform 0.1s;
        }
        .diff-btn:active { transform: translateY(6px); box-shadow: none; }
        .diff-btn.hard { background-color: #e84118; box-shadow: 0 6px 0 #a02912; }
        .diff-btn.medium { background-color: #fbc531; box-shadow: 0 6px 0 #b38c0f; color: #333; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <a href="index.html" class="home-btn">🏠</a>
        
        <div class="score-board">
            <div class="score-box">
                MODE
                <span id="mode-display">EASY</span>
            </div>
            <div class="score-box">
                ALL TIME
                <span id="score-display">0</span>
            </div>
        </div>

        <button class="pause-btn" id="pause-btn">⏸</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="350" height="450"></canvas>
    </div>

    <div class="overlay" id="start-menu">
        <h1>SNAKE</h1>
        <button class="diff-btn" onclick="startGame('easy')">EASY</button>
        <button class="diff-btn medium" onclick="startGame('medium')">MEDIUM</button>
        <button class="diff-btn hard" onclick="startGame('hard')">HARD</button>
    </div>

    <div class="overlay hidden" id="pause-menu">
        <h1 id="pause-title">PAUSED</h1>
        <button class="diff-btn" id="resume-btn">RESUME</button>
        <button class="diff-btn hard" onclick="location.reload()">RESTART</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const gridSize = 25; 
    const tileCountX = canvas.width / gridSize;
    const tileCountY = canvas.height / gridSize;
    
    // --- تغییر مهم: آرایه‌ای برای نگهداری چند سیب ---
    let foods = []; 
    const MAX_FOODS = 3; // تعداد سیب‌های همزمان روی صفحه (می‌توانید تغییر دهید)

    let snake = [];
    let velocity = { x: 0, y: 0 };
    let score = 0;
    let isPaused = true;
    let gameLoop;
    let speed = 150; 
    let currentMode = 'easy';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'eat') {
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'die') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
    }

    function startGame(mode) {
        document.getElementById('start-menu').classList.add('hidden');
        
        currentMode = mode.toUpperCase();
        document.getElementById('mode-display').innerText = currentMode;
        
        if (mode === 'easy') speed = 180;
        else if (mode === 'medium') speed = 120;
        else if (mode === 'hard') speed = 70;

        resetGame();
        isPaused = false;
        document.getElementById('pause-btn').innerText = '⏸';
        clearInterval(gameLoop);
        gameLoop = setInterval(update, speed);
        draw();
    }

    function resetGame() {
        snake = [
            { x: 7, y: 9 },
            { x: 6, y: 9 },
            { x: 5, y: 9 }
        ];
        velocity = { x: 1, y: 0 }; 
        score = 0;
        document.getElementById('score-display').innerText = score;
        
        // خالی کردن آرایه سیب‌ها و تولید سیب‌های جدید
        foods = [];
        for(let i=0; i < MAX_FOODS; i++) {
            generateFood();
        }
    }

    // تابع تولید یک سیب جدید
    function generateFood() {
        let newFood;
        let isValid = false;

        while (!isValid) {
            newFood = {
                x: Math.floor(Math.random() * tileCountX),
                y: Math.floor(Math.random() * tileCountY)
            };
            
            // چک کردن اینکه سیب روی مار نباشد
            let onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
            // چک کردن اینکه سیب روی سیب‌های دیگر نباشد
            let onOtherFood = foods.some(f => f.x === newFood.x && f.y === newFood.y);

            if (!onSnake && !onOtherFood) {
                isValid = true;
            }
        }
        foods.push(newFood);
    }

    function update() {
        if (isPaused) return;

        const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

        if (head.x < 0 || head.x >= tileCountX || head.y < 0 || head.y >= tileCountY) {
            gameOver();
            return;
        }

        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        // بررسی برخورد با هر یک از سیب‌ها
        let ateFood = false;
        for (let i = 0; i < foods.length; i++) {
            if (head.x === foods[i].x && head.y === foods[i].y) {
                ateFood = true;
                foods.splice(i, 1); // سیب خورده شده را از آرایه حذف کن
                generateFood(); // یک سیب جدید تولید کن
                break; // از حلقه خارج شو چون در هر حرکت فقط یک سیب خورده می‌شود
            }
        }

        if (ateFood) {
            score += 10;
            document.getElementById('score-display').innerText = score;
            playSound('eat');
            
            if (currentMode === 'HARD' && score % 50 === 0) {
                clearInterval(gameLoop);
                speed = Math.max(40, speed - 10);
                gameLoop = setInterval(update, speed);
            }
        } else {
            snake.pop(); 
        }

        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // رسم پس زمینه
        for (let row = 0; row < tileCountY; row++) {
            for (let col = 0; col < tileCountX; col++) {
                ctx.fillStyle = (row + col) % 2 === 0 ? '#ffeaa7' : '#fdcb6e'; 
                ctx.fillRect(col * gridSize, row * gridSize, gridSize, gridSize);
            }
        }

        // رسم مار
        for (let i = 0; i < snake.length; i++) {
            const segment = snake[i];
            const x = segment.x * gridSize;
            const y = segment.y * gridSize;

            ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, 5);
            ctx.fill();

            if (i === 0) {
                ctx.fillStyle = 'white';
                let eye1X, eye1Y, eye2X, eye2Y;
                const eyeRadius = 4;
                const pupilRadius = 2;
                const offset = 7; 

                if (velocity.x === 1) { 
                    eye1X = x + gridSize - offset; eye1Y = y + offset;
                    eye2X = x + gridSize - offset; eye2Y = y + gridSize - offset;
                } else if (velocity.x === -1) { 
                    eye1X = x + offset; eye1Y = y + offset;
                    eye2X = x + offset; eye2Y = y + gridSize - offset;
                } else if (velocity.y === -1) { 
                    eye1X = x + offset; eye1Y = y + offset;
                    eye2X = x + gridSize - offset; eye2Y = y + offset;
                } else { 
                    eye1X = x + offset; eye1Y = y + gridSize - offset;
                    eye2X = x + gridSize - offset; eye2Y = y + gridSize - offset;
                }

                ctx.beginPath(); ctx.arc(eye1X, eye1Y, eyeRadius, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(eye2X, eye2Y, eyeRadius, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(eye1X, eye1Y, pupilRadius, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(eye2X, eye2Y, pupilRadius, 0, Math.PI * 2); ctx.fill();
            }
        }

        // رسم تمام سیب‌های موجود در آرایه
        foods.forEach(food => {
            const foodCenterX = (food.x * gridSize) + (gridSize / 2);
            const foodCenterY = (food.y * gridSize) + (gridSize / 2);
            
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(foodCenterX, foodCenterY, (gridSize / 2) - 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.ellipse(foodCenterX + 3, foodCenterY - 8, 4, 2, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function gameOver() {
        isPaused = true;
        clearInterval(gameLoop);
        playSound('die');
        
        document.getElementById('pause-title').innerText = 'GAME OVER';
        document.getElementById('pause-menu').classList.remove('hidden');
        document.getElementById('resume-btn').classList.add('hidden'); 
    }

    function changeDirection(dir) {
        if (isPaused) return;
        
        if (dir === 'UP' && velocity.y === 0) { velocity = { x: 0, y: -1 }; }
        else if (dir === 'DOWN' && velocity.y === 0) { velocity = { x: 0, y: 1 }; }
        else if (dir === 'LEFT' && velocity.x === 0) { velocity = { x: -1, y: 0 }; }
        else if (dir === 'RIGHT' && velocity.x === 0) { velocity = { x: 1, y: 0 }; }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDirection('UP');
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDirection('DOWN');
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDirection('LEFT');
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDirection('RIGHT');
        if (e.key === ' ' || e.key === 'Escape') togglePause();
    });

    document.getElementById('pause-btn').addEventListener('click', togglePause);

    function togglePause() {
        if (document.getElementById('start-menu').classList.contains('hidden') === false) return;
        if (document.getElementById('pause-title').innerText === 'GAME OVER') return;

        isPaused = !isPaused;
        
        if (isPaused) {
            document.getElementById('pause-btn').innerText = '▶';
            document.getElementById('pause-title').innerText = 'PAUSED';
            document.getElementById('pause-menu').classList.remove('hidden');
            document.getElementById('resume-btn').classList.remove('hidden');
        } else {
            document.getElementById('pause-btn').innerText = '⏸';
            document.getElementById('pause-menu').classList.add('hidden');
        }
    }

    document.getElementById('resume-btn').addEventListener('click', togglePause);

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x+r, y);
            this.arcTo(x+w, y,   x+w, y+h, r);
            this.arcTo(x+w, y+h, x,   y+h, r);
            this.arcTo(x,   y+h, x,   y,   r);
            this.arcTo(x,   y,   x+w, y,   r);
            this.closePath();
            return this;
        }
    }
</script>
</body>
</html>
