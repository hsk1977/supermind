<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #f5f0e6;
            --bg-panel: #faf6ef;
            --border: #d4c9b8;
            --accent: #2e7d32;
            --accent-glow: rgba(46, 125, 50, 0.25);
            --snake-head: #2e7d32;
            --snake-body: #388e3c;
            --food: #e53935;
            --food-glow: rgba(229, 57, 53, 0.4);
            --text: #4e4a42;
            --text-bright: #2c2a24;
            --gold: #f9a825;
            --home-btn: #e53935;
            --home-btn-hover: #c62828;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Poppins", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f5f0e6 0%, #ebe4d6 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .home-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--home-btn), var(--home-btn-hover));
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(229, 57, 53, 0.35), 0 0 0 1px rgba(255,255,255,0.2) inset;
            transition: transform 0.15s, box-shadow 0.15s;
            z-index: 100;
        }
        .home-btn:hover { transform: translateY(-2px) scale(1.05); }
        .home-btn:active { transform: translateY(0) scale(0.98); }

        h1 {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 2px 10px var(--accent-glow);
            margin-bottom: 0.1rem;
            letter-spacing: -1px;
            margin-top: 4px;
        }
        .subtitle { font-size: 0.8rem; color: var(--text); opacity: 0.7; margin-bottom: 0.6rem; }

        #game-container {
            position: relative;
            border-radius: 16px;
            padding: 8px;
            background: linear-gradient(145deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 100%);
            box-shadow: 0 0 0 1px var(--border), 0 12px 40px rgba(0,0,0,0.1), 0 0 30px rgba(46,125,50,0.06);
        }

        canvas { display: block; border-radius: 10px; background: #f0ece3; box-shadow: inset 0 0 20px rgba(0,0,0,0.06); }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .hud-item { display: flex; align-items: center; gap: 4px; }
        .hud-label { color: var(--text); opacity: 0.6; font-size: 0.75rem; }
        .hud-value { color: var(--text-bright); font-size: 0.95rem; min-width: 32px; text-align: left; }
        .score-value { color: var(--accent); }
        .highscore-value { color: var(--gold); }

        .pause-btn {
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.5);
            color: var(--text-bright);
            transition: all 0.2s;
        }
        .pause-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(46, 125, 50, 0.08); }
        .pause-btn:active { transform: scale(0.96); }
        .pause-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .overlay {
            position: absolute;
            inset: 8px;
            border-radius: 10px;
            background: rgba(245, 240, 230, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .overlay h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: 0.3rem; text-shadow: 0 2px 10px var(--accent-glow); }
        .overlay p { color: var(--text); opacity: 0.8; margin-bottom: 1rem; font-size: 0.9rem; }

        .btn {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--snake-body), var(--snake-head));
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow), 0 0 0 1px rgba(255,255,255,0.2) inset;
            transition: transform 0.15s, box-shadow 0.15s;
            margin: 4px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow), 0 0 0 1px rgba(255,255,255,0.3) inset; }
        .btn:active { transform: translateY(0); }

        .difficulty-select { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; justify-content: center; }
        .diff-btn {
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            color: var(--text);
            transition: all 0.2s;
        }
        .diff-btn.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .diff-btn:hover { border-color: var(--text-bright); color: var(--text-bright); }

        .final-score { font-size: 1.1rem; color: var(--gold); margin-bottom: 0.6rem; font-weight: 700; }

        .mobile-controls {
            display: none;
            margin-top: 0.6rem;
            gap: 4px;
            flex-direction: column;
            align-items: center;
        }
        .d-pad-row { display: flex; gap: 4px; }
        .dpad-btn {
            width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--border);
            background: rgba(255,255,255,0.5); color: var(--text-bright); font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.1s; -webkit-tap-highlight-color: transparent;
        }
        .dpad-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }

        @media (max-width: 520px) {
            .mobile-controls { display: flex; }
            #game-container { padding: 6px; }
            .overlay { inset: 6px; }
            .home-btn { width: 36px; height: 36px; font-size: 1rem; top: 6px; left: 6px; }
        }

        .controls-hint { margin-top: 0.6rem; font-size: 0.7rem; color: var(--text); opacity: 0.5; }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn" title="Home">&#8962;</a>

    <h1>Snake Game</h1>
    <div class="subtitle">Professional & Addictive</div>

    <div id="game-container">
        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">Score:</span>
                <span class="hud-value score-value" id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Best:</span>
                <span class="hud-value highscore-value" id="highscore">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Level:</span>
                <span class="hud-value" id="level-display">Medium</span>
            </div>
            <button class="pause-btn" id="pause-btn" disabled>Pause</button>
        </div>

        <canvas id="game" width="320" height="320"></canvas>

        <!-- Start Screen -->
        <div class="overlay" id="start-screen">
            <h2>Ready?</h2>
            <p>Select difficulty level</p>
            <div class="difficulty-select">
                <button class="diff-btn" data-speed="180" data-name="Easy">Easy</button>
                <button class="diff-btn active" data-speed="140" data-name="Medium">Medium</button>
                <button class="diff-btn" data-speed="75" data-name="Hard">Hard</button>
                <button class="diff-btn" data-speed="50" data-name="Pro">Pro</button>
            </div>
            <button class="btn" id="start-btn">Start Game</button>
            <div class="controls-hint">Use arrow keys or WASD. Space to pause.</div>
        </div>

        <!-- Game Over Screen -->
        <div class="overlay hidden" id="gameover-screen">
            <h2>Game Over!</h2>
            <div class="final-score" id="final-score">Score: 0</div>
            <p id="new-record" style="display:none; color: var(--gold); font-weight:700;">&#127942; New Record!</p>
            <button class="btn" id="restart-btn">Play Again</button>
            <button class="btn" id="menu-btn" style="background: linear-gradient(135deg, #888, #aaa);">Main Menu</button>
        </div>

        <!-- Pause Screen -->
        <div class="overlay hidden" id="pause-screen">
            <h2>Paused</h2>
            <p>Game is paused</p>
            <button class="btn" id="resume-btn">Resume</button>
        </div>
    </div>

    <div class="mobile-controls">
        <div class="d-pad-row">
            <button class="dpad-btn" data-dir="up">&#9650;</button>
        </div>
        <div class="d-pad-row">
            <button class="dpad-btn" data-dir="left">&#9664;</button>
            <button class="dpad-btn" data-dir="down">&#9660;</button>
            <button class="dpad-btn" data-dir="right">&#9654;</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const levelDisplayEl = document.getElementById('level-display');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const pauseScreen = document.getElementById('pause-screen');
const finalScoreEl = document.getElementById('final-score');
const newRecordEl = document.getElementById('new-record');
const pauseBtn = document.getElementById('pause-btn');

function resizeCanvas() {
    const maxSize = Math.min(window.innerWidth - 32, 420);
    const size = Math.max(260, maxSize);
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const GRID = 16;
const TILE_COUNT = 20;

let snake = [];
let food = {};
let direction = { x: 0, y: 0 };
let nextDirection = { x: 0, y: 0 };
let score = 0;
let highscore = parseInt(localStorage.getItem('snake_highscore') || '0');
let gameLoopId = null;
let lastTime = 0;
let gameSpeed = 80;
let isRunning = false;
let isPaused = false;
let particles = [];
let pulse = 0;
let selectedSpeed = 140;
let selectedName = 'Medium';

highscoreEl.textContent = highscore;

document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedSpeed = parseInt(btn.dataset.speed);
        selectedName = btn.dataset.name;
        levelDisplayEl.textContent = selectedName;
    });
});

function initGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = '0';
    gameSpeed = selectedSpeed;
    spawnFood();
    particles = [];
    isRunning = true;
    isPaused = false;
    pauseBtn.disabled = false;
    pauseBtn.textContent = 'Pause';
    lastTime = performance.now();
    cancelAnimationFrame(gameLoopId);
    gameLoopId = requestAnimationFrame(gameLoop);
}

function spawnFood() {
    let valid = false;
    while (!valid) {
        food = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT)
        };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
}

function createParticles(x, y, color) {
    const cx = (x + 0.5) * GRID;
    const cy = (y + 0.5) * GRID;
    for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12;
        particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * (1 + Math.random() * 2),
            vy: Math.sin(angle) * (1 + Math.random() * 2),
            life: 1, decay: 0.02 + Math.random() * 0.03,
            color: color, size: 2 + Math.random() * 3
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function update() {
    if (isPaused || !isRunning) return;
    direction = { ...nextDirection };
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver(); return;
    }
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        createParticles(food.x, food.y, '#e53935');
        spawnFood();
        if (gameSpeed > 30) gameSpeed -= 0.5;
    } else {
        snake.pop();
    }
}

function drawGrid() {
    ctx.strokeStyle = 'rgba(46, 125, 50, 0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
    }
}

function drawSnake() {
    snake.forEach((segment, i) => {
        const x = segment.x * GRID;
        const y = segment.y * GRID;
        const isHead = i === 0;

        if (isHead) { ctx.shadowColor = '#2e7d32'; ctx.shadowBlur = 12; }
        else { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; }

        const gradient = ctx.createRadialGradient(x + GRID/2, y + GRID/2, 2, x + GRID/2, y + GRID/2, GRID/2 + 1);
        if (isHead) {
            gradient.addColorStop(0, '#4caf50');
            gradient.addColorStop(1, '#2e7d32');
        } else {
            const fade = Math.max(0.4, 1 - i * 0.03);
            gradient.addColorStop(0, `rgba(76, 175, 80, ${fade})`);
            gradient.addColorStop(1, `rgba(46, 125, 50, ${fade})`);
        }

        const pad = isHead ? 1 : 2;
        ctx.fillStyle = gradient;
        roundRect(ctx, x + pad, y + pad, GRID - pad*2, GRID - pad*2, 5);
        ctx.fill();

        if (isHead) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            const eyeSize = 2;
            let ex1, ey1, ex2, ey2;
            if (direction.x === 1) { ex1 = x + 11; ey1 = y + 5; ex2 = x + 11; ey2 = y + 11; }
            else if (direction.x === -1) { ex1 = x + 5; ey1 = y + 5; ex2 = x + 5; ey2 = y + 11; }
            else if (direction.y === -1) { ex1 = x + 5; ey1 = y + 5; ex2 = x + 11; ey2 = y + 5; }
            else { ex1 = x + 5; ey1 = y + 11; ex2 = x + 11; ey2 = y + 11; }
            ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(ex1 + 0.3, ey1 + 0.3, 1, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2 + 0.3, ey2 + 0.3, 1, 0, Math.PI*2); ctx.fill();
        }
    });
    ctx.shadowBlur = 0;
}

function drawFood() {
    const x = food.x * GRID + GRID/2;
    const y = food.y * GRID + GRID/2;
    const r = GRID/2 - 2 + Math.sin(pulse) * 1.2;

    ctx.shadowColor = '#e53935'; ctx.shadowBlur = 10;
    const gradient = ctx.createRadialGradient(x, y, 2, x, y, r);
    gradient.addColorStop(0, '#ef5350');
    gradient.addColorStop(1, '#c62828');
    ctx.fillStyle = gradient;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 2.5, 0, Math.PI * 2); ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid(); drawFood(); drawSnake(); drawParticles();
}

function gameLoop(timestamp) {
    if (!isRunning) return;
    gameLoopId = requestAnimationFrame(gameLoop);
    const delta = timestamp - lastTime;
    if (delta >= gameSpeed) {
        lastTime = timestamp;
        update();
        pulse += 0.15;
    }
    updateParticles();
    draw();
}

function gameOver() {
    isRunning = false;
    pauseBtn.disabled = true;
    pauseBtn.textContent = 'Pause';
    cancelAnimationFrame(gameLoopId);

    let isNewRecord = false;
    if (score > highscore) {
        highscore = score;
        localStorage.setItem('snake_highscore', highscore);
        highscoreEl.textContent = highscore;
        isNewRecord = true;
    }
    finalScoreEl.textContent = 'Score: ' + score;
    newRecordEl.style.display = isNewRecord ? 'block' : 'none';
    gameoverScreen.classList.remove('hidden');
}

function togglePause() {
    if (!isRunning) return;
    isPaused = !isPaused;
    if (isPaused) {
        pauseScreen.classList.remove('hidden');
        cancelAnimationFrame(gameLoopId);
        pauseBtn.textContent = 'Resume';
    } else {
        pauseScreen.classList.add('hidden');
        lastTime = performance.now();
        gameLoopId = requestAnimationFrame(gameLoop);
        pauseBtn.textContent = 'Pause';
    }
}

// Keyboard controls
document.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
    }
    if (e.key === ' ') {
        if (isRunning) togglePause();
        return;
    }
    if (!isRunning || isPaused) return;
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
            if (direction.y === 0) nextDirection = { x: 0, y: -1 }; break;
        case 'ArrowDown': case 's': case 'S':
            if (direction.y === 0) nextDirection = { x: 0, y: 1 }; break;
        case 'ArrowLeft': case 'a': case 'A':
            if (direction.x === 0) nextDirection = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D':
            if (direction.x === 0) nextDirection = { x: 1, y: 0 }; break;
    }
});

// Touch / mobile controls
document.querySelectorAll('.dpad-btn').forEach(btn => {
    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        const dir = btn.dataset.dir;
        if (!isRunning || isPaused) return;
        if (dir === 'up' && direction.y === 0) nextDirection = { x: 0, y: -1 };
        if (dir === 'down' && direction.y === 0) nextDirection = { x: 0, y: 1 };
        if (dir === 'left' && direction.x === 0) nextDirection = { x: -1, y: 0 };
        if (dir === 'right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
    });
    btn.addEventListener('mousedown', e => {
        const dir = btn.dataset.dir;
        if (!isRunning || isPaused) return;
        if (dir === 'up' && direction.y === 0) nextDirection = { x: 0, y: -1 };
        if (dir === 'down' && direction.y === 0) nextDirection = { x: 0, y: 1 };
        if (dir === 'left' && direction.x === 0) nextDirection = { x: -1, y: 0 };
        if (dir === 'right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
    });
});

// Button handlers
document.getElementById('start-btn').addEventListener('click', () => {
    startScreen.classList.add('hidden');
    initGame();
});

document.getElementById('restart-btn').addEventListener('click', () => {
    gameoverScreen.classList.add('hidden');
    initGame();
});

document.getElementById('menu-btn').addEventListener('click', () => {
    gameoverScreen.classList.add('hidden');
    startScreen.classList.remove('hidden');
});

document.getElementById('resume-btn').addEventListener('click', () => {
    togglePause();
});

pauseBtn.addEventListener('click', () => {
    if (isRunning) togglePause();
});

// Initial draw
ctx.fillStyle = '#f0ece3';
ctx.fillRect(0, 0, canvas.width, canvas.height);
drawGrid();
</script>
</body>
</html>
