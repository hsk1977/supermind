<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Puzzle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #c97b6a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-top: 10px;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 20px;
            color: #8b5e5e;
            transition: transform 0.1s;
        }

        .circle-btn:active {
            transform: scale(0.95);
        }

        .home-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #e74c3c;
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.3s;
        }

        .home-btn:hover {
            background: #c0392b;
        }

        .home-btn:active {
            transform: scale(0.95);
        }

        .score-box {
            background: #5d3a3a;
            padding: 8px 20px;
            border-radius: 8px;
            text-align: center;
            min-width: 100px;
        }

        .score-label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 22px;
            font-weight: bold;
            color: #4ecdc4;
        }

        .all-time-box {
            background: #5d3a3a;
            padding: 8px 20px;
            border-radius: 8px;
            text-align: center;
            min-width: 100px;
            position: relative;
        }

        .crown {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
        }

        .difficulty-select {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .diff-btn {
            padding: 8px 20px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .diff-btn.active {
            background: #fff;
            color: #c97b6a;
        }

        .game-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .game-container {
            position: relative;
        }

        .grid-container {
            background: #7a4e4e;
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-template-rows: repeat(4, 80px);
            gap: 10px;
            position: relative;
        }

        .grid-cell {
            background: #8b5e5e;
            border-radius: 6px;
            width: 80px;
            height: 80px;
        }

        .tile-container {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #fff5e6;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #4a4a4a;
            transition: all 0.15s ease;
            z-index: 10;
        }

        .tile.new {
            animation: popIn 0.2s ease;
        }

        .tile.merged {
            animation: mergePop 0.2s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes mergePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .tile-2 { background: #fff5e6; color: #4a4a4a; }
        .tile-4 { background: #ffe4c4; color: #4a4a4a; }
        .tile-8 { background: #ffcba4; color: #fff; }
        .tile-16 { background: #e8a87c; color: #fff; }
        .tile-32 { background: #d4896a; color: #fff; }
        .tile-64 { background: #c06c5f; color: #fff; }
        .tile-128 { background: #ffdb7a; color: #4a4a4a; font-size: 24px; }
        .tile-256 { background: #f0d060; color: #4a4a4a; font-size: 24px; }
        .tile-512 { background: #e8c040; color: #fff; font-size: 24px; }
        .tile-1024 { background: #d4a017; color: #fff; font-size: 20px; }
        .tile-2048 { background: #c99700; color: #fff; font-size: 20px; }
        .tile-4096 { background: #8b4513; color: #fff; font-size: 20px; }

        .side-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .arrow-controls {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 55px);
            gap: 5px;
        }

        .arrow-btn {
            background: #5d3a3a;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .arrow-btn:active {
            transform: scale(0.95);
            background: #7a4e4e;
        }

        .arrow-up { grid-column: 2; grid-row: 1; }
        .arrow-left { grid-column: 1; grid-row: 2; }
        .arrow-down { grid-column: 2; grid-row: 2; }
        .arrow-right { grid-column: 3; grid-row: 2; }

        .controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .undo-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #3a3a3a;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .undo-btn:active {
            transform: scale(0.95);
        }

        .undo-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #3a3a3a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .undo-label {
            margin-top: 5px;
            font-weight: bold;
            color: #3a3a3a;
        }

        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
        }

        .message-overlay.show {
            display: flex;
        }

        .message-box {
            background: #fff;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            color: #4a4a4a;
        }

        .message-box h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .message-box button {
            margin-top: 15px;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            background: #c97b6a;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #5d3a3a;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        @media (max-width: 500px) {
            .game-wrapper {
                flex-direction: column;
            }
            .side-controls {
                flex-direction: row;
                order: 2;
            }
            .arrow-controls {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(2, 50px);
            }
            .grid-container {
                grid-template-columns: repeat(4, 70px);
                grid-template-rows: repeat(4, 70px);
            }
            .grid-cell, .tile {
                width: 70px;
                height: 70px;
            }
            .tile { font-size: 24px; }
            .tile-128, .tile-256 { font-size: 20px; }
            .tile-1024, .tile-2048, .tile-4096 { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-left">
            <a href="index.html" class="home-btn">&#127968;</a>
            <button class="circle-btn" onclick="game.goBack()">&#10094;</button>
        </div>
        <div class="score-box">
            <div class="score-label" id="modeLabel">MEDIUM MODE</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="all-time-box">
            <div class="crown">&#128081;</div>
            <div class="score-label">ALL TIME</div>
            <div class="score-value" id="bestScore">0</div>
        </div>
        <button class="circle-btn" onclick="game.restart()">&#8635;</button>
    </div>

    <div class="difficulty-select">
        <button class="diff-btn" data-diff="easy" onclick="game.setDifficulty('easy')">EASY</button>
        <button class="diff-btn active" data-diff="medium" onclick="game.setDifficulty('medium')">MEDIUM</button>
        <button class="diff-btn" data-diff="hard" onclick="game.setDifficulty('hard')">HARD</button>
    </div>

    <div class="game-wrapper">
        <div class="game-container">
            <div class="grid-container">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="tile-container" id="tileContainer"></div>
            </div>
        </div>

        <div class="side-controls">
            <div class="arrow-controls">
                <button class="arrow-btn arrow-up" onclick="game.move('up')">&#9650;</button>
                <button class="arrow-btn arrow-left" onclick="game.move('left')">&#9664;</button>
                <button class="arrow-btn arrow-down" onclick="game.move('down')">&#9660;</button>
                <button class="arrow-btn arrow-right" onclick="game.move('right')">&#9654;</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="undo-btn" onclick="game.undo()">
            &#8617;
            <span class="undo-count" id="undoCount">1</span>
        </button>
        <div class="undo-label">Undo</div>
    </div>

    <div class="message-overlay" id="messageOverlay">
        <div class="message-box">
            <h2 id="messageTitle">Game Over!</h2>
            <p id="messageText">Your score: 0</p>
            <button onclick="game.restart()">Try Again</button>
            <button onclick="document.getElementById('messageOverlay').classList.remove('show')">Continue</button>
        </div>
    </div>

    <button class="sound-toggle" id="soundBtn" onclick="game.toggleSound()">&#128266;</button>

    <script>
        class AudioManager {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, volume = 0.3) {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            move() {
                this.playTone(200, 'sine', 0.08, 0.15);
            }

            merge() {
                this.playTone(400, 'triangle', 0.15, 0.2);
                setTimeout(() => this.playTone(600, 'triangle', 0.15, 0.2), 80);
            }

            win() {
                [523, 659, 784, 1047].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'square', 0.2, 0.15), i * 120);
                });
            }

            gameOver() {
                [400, 350, 300, 200].forEach((freq, i) => {
                    setTimeout(() => this.playTone(freq, 'sawtooth', 0.3, 0.1), i * 200);
                });
            }

            spawn() {
                this.playTone(300, 'sine', 0.1, 0.1);
            }

            undo() {
                this.playTone(250, 'sine', 0.1, 0.15);
            }
        }

        class Game2048 {
            constructor() {
                this.gridSize = 4;
                this.grid = [];
                this.score = 0;
                this.difficulty = 'medium';
                this.undoCount = 1;
                this.audio = new AudioManager();
                this.history = [];
                this.targets = { easy: 512, medium: 2048, hard: 4096 };
                this.spawnRates = {
                    easy: [{ val: 2, prob: 0.95 }, { val: 4, prob: 0.05 }],
                    medium: [{ val: 2, prob: 0.85 }, { val: 4, prob: 0.15 }],
                    hard: [{ val: 2, prob: 0.75 }, { val: 4, prob: 0.20 }, { val: 8, prob: 0.05 }]
                };
                this.won = false;
                this.loadBestScore();
                this.init();
                this.setupInput();
            }

            init() {
                this.grid = Array(this.gridSize * this.gridSize).fill(0);
                this.score = 0;
                this.undoCount = this.difficulty === 'easy' ? 3 : (this.difficulty === 'hard' ? 0 : 1);
                this.won = false;
                this.history = [];
                this.updateUI();
                this.spawnTile();
                this.spawnTile();
                this.render();
            }

            loadBestScore() {
                const saved = localStorage.getItem('bestScore_2048');
                this.bestScore = saved ? parseInt(saved) : 0;
                document.getElementById('bestScore').textContent = this.bestScore;
            }

            saveBestScore() {
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('bestScore_2048', this.bestScore);
                    document.getElementById('bestScore').textContent = this.bestScore;
                }
            }

            setDifficulty(diff) {
                this.difficulty = diff;
                document.querySelectorAll('.diff-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.diff === diff);
                });
                document.getElementById('modeLabel').textContent = diff.toUpperCase() + ' MODE';
                this.restart();
            }

            getSpawnValue() {
                const rates = this.spawnRates[this.difficulty];
                const rand = Math.random();
                let cum = 0;
                for (const r of rates) {
                    cum += r.prob;
                    if (rand <= cum) return r.val;
                }
                return rates[0].val;
            }

            spawnTile() {
                const empty = [];
                for (let i = 0; i < this.grid.length; i++) {
                    if (this.grid[i] === 0) empty.push(i);
                }
                if (empty.length > 0) {
                    const idx = empty[Math.floor(Math.random() * empty.length)];
                    this.grid[idx] = this.getSpawnValue();
                    this.audio.spawn();
                    return idx;
                }
                return -1;
            }

            render() {
                const container = document.getElementById('tileContainer');
                container.innerHTML = '';
                const cellSize = window.innerWidth <= 500 ? 70 : 80;
                const gap = 10;

                for (let i = 0; i < this.grid.length; i++) {
                    if (this.grid[i] !== 0) {
                        const tile = document.createElement('div');
                        tile.className = `tile tile-${this.grid[i]}`;
                        tile.textContent = this.grid[i];
                        const row = Math.floor(i / this.gridSize);
                        const col = i % this.gridSize;
                        tile.style.left = `${col * (cellSize + gap)}px`;
                        tile.style.top = `${row * (cellSize + gap)}px`;
                        container.appendChild(tile);
                    }
                }
            }

            updateUI() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('undoCount').textContent = this.undoCount;
            }

            saveState() {
                this.history.push({
                    grid: [...this.grid],
                    score: this.score,
                    undoCount: this.undoCount
                });
                if (this.history.length > 10) this.history.shift();
            }

            undo() {
                if (this.undoCount > 0 && this.history.length > 0) {
                    const state = this.history.pop();
                    this.grid = state.grid;
                    this.score = state.score;
                    this.undoCount = state.undoCount;
                    this.updateUI();
                    this.render();
                    this.audio.undo();
                }
            }

            move(direction) {
                this.audio.init();
                this.saveState();
                const previous = [...this.grid];
                let moved = false;
                let merged = false;

                const getIndex = (r, c) => r * this.gridSize + c;

                for (let i = 0; i < this.gridSize; i++) {
                    let line = [];
                    for (let j = 0; j < this.gridSize; j++) {
                        let r, c;
                        if (direction === 'left') { r = i; c = j; }
                        else if (direction === 'right') { r = i; c = this.gridSize - 1 - j; }
                        else if (direction === 'up') { r = j; c = i; }
                        else { r = this.gridSize - 1 - j; c = i; }
                        line.push(this.grid[getIndex(r, c)]);
                    }

                    const filtered = line.filter(v => v !== 0);
                    const newLine = [];
                    for (let k = 0; k < filtered.length; k++) {
                        if (k + 1 < filtered.length && filtered[k] === filtered[k + 1]) {
                            newLine.push(filtered[k] * 2);
                            this.score += filtered[k] * 2;
                            merged = true;
                            k++;
                        } else {
                            newLine.push(filtered[k]);
                        }
                    }
                    while (newLine.length < this.gridSize) newLine.push(0);

                    for (let j = 0; j < this.gridSize; j++) {
                        let r, c;
                        if (direction === 'left') { r = i; c = j; }
                        else if (direction === 'right') { r = i; c = this.gridSize - 1 - j; }
                        else if (direction === 'up') { r = j; c = i; }
                        else { r = this.gridSize - 1 - j; c = i; }
                        this.grid[getIndex(r, c)] = newLine[j];
                    }
                }

                if (JSON.stringify(previous) !== JSON.stringify(this.grid)) {
                    moved = true;
                    this.undoCount = Math.max(0, this.undoCount - 1);
                    if (merged) this.audio.merge();
                    else this.audio.move();
                    this.spawnTile();
                    this.updateUI();
                    this.render();
                    this.saveBestScore();
                    this.checkGameState();
                } else {
                    this.history.pop();
                }
            }

            checkGameState() {
                const maxTile = Math.max(...this.grid);
                if (!this.won && maxTile >= this.targets[this.difficulty]) {
                    this.won = true;
                    this.audio.win();
                    document.getElementById('messageTitle').textContent = 'You Win!';
                    document.getElementById('messageText').textContent = `Congratulations! You reached ${maxTile}!`;
                    document.getElementById('messageOverlay').classList.add('show');
                    return;
                }

                if (!this.canMove()) {
                    this.audio.gameOver();
                    document.getElementById('messageTitle').textContent = 'Game Over!';
                    document.getElementById('messageText').textContent = `Your score: ${this.score}`;
                    document.getElementById('messageOverlay').classList.add('show');
                }
            }

            canMove() {
                for (let i = 0; i < this.grid.length; i++) {
                    if (this.grid[i] === 0) return true;
                }
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        const idx = r * this.gridSize + c;
                        if (c < this.gridSize - 1 && this.grid[idx] === this.grid[idx + 1]) return true;
                        if (r < this.gridSize - 1 && this.grid[idx] === this.grid[idx + this.gridSize]) return true;
                    }
                }
                return false;
            }

            restart() {
                this.saveBestScore();
                this.init();
                document.getElementById('messageOverlay').classList.remove('show');
            }

            goBack() {
                window.history.back();
            }

            toggleSound() {
                this.audio.enabled = !this.audio.enabled;
                document.getElementById('soundBtn').innerHTML = this.audio.enabled ? '&#128266;' : '&#128263;';
            }

            setupInput() {
                let touchStartX = 0;
                let touchStartY = 0;

                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'ArrowUp': e.preventDefault(); this.move('up'); break;
                        case 'ArrowDown': e.preventDefault(); this.move('down'); break;
                        case 'ArrowLeft': e.preventDefault(); this.move('left'); break;
                        case 'ArrowRight': e.preventDefault(); this.move('right'); break;
                        case 'u': this.undo(); break;
                    }
                });

                document.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                document.addEventListener('touchend', (e) => {
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    const minSwipe = 50;
                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipe) {
                        this.move(dx > 0 ? 'right' : 'left');
                    } else if (Math.abs(dy) > minSwipe) {
                        this.move(dy > 0 ? 'down' : 'up');
                    }
                }, { passive: true });
            }
        }

        const game = new Game2048();
    </script>
</body>
</html>
