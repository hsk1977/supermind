<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>aa Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        #topBar > * {
            pointer-events: auto;
        }

        #homeBtn {
            width: 50px;
            height: 50px;
            background: #e74c3c;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        #homeBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }

        #homeBtn:active {
            transform: scale(0.95);
        }

        #scoreInfo {
            font-size: 17px;
            color: #fff;
            font-weight: 300;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.5;
            background: rgba(0,0,0,0.30);
            padding: 6px 22px;
            border-radius: 20px;
            white-space: nowrap;
            margin: 0 12px;
        }

        #pauseBtn {
            width: 50px;
            height: 50px;
            background: #f39c12;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            transition: transform 0.2s;
            font-family: inherit;
            flex-shrink: 0;
        }

        #pauseBtn:hover {
            transform: scale(1.1);
        }

        #pauseBtn:active {
            transform: scale(0.95);
        }

        .screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        #gameScreen {
            display: none;
        }

        #gameOverScreen {
            display: none;
            background: rgba(0,0,0,0.88);
            z-index: 90;
        }

        #pauseScreen {
            display: none;
            background: rgba(0,0,0,0.80);
            z-index: 85;
        }

        h1 {
            font-size: clamp(60px, 15vw, 120px);
            margin-bottom: 10px;
            letter-spacing: 12px;
            font-weight: 300;
        }

        .subtitle {
            font-size: clamp(14px, 3vw, 18px);
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        .difficulty-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .diff-btn {
            padding: 12px 28px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            font-family: inherit;
            min-width: 100px;
        }

        .diff-btn.active {
            background: #fff;
            color: #1a1a2e;
            font-weight: bold;
        }

        .diff-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .diff-btn.active:hover {
            background: #fff;
        }

        #playBtn {
            padding: 16px 70px;
            font-size: 24px;
            background: #fff;
            color: #1a1a2e;
            border: none;
            border-radius: 35px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
        }

        #playBtn:hover {
            transform: scale(1.05);
        }

        #playBtn:active {
            transform: scale(0.98);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #gameOverScreen h2 {
            font-size: clamp(36px, 10vw, 56px);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        #pauseScreen h2 {
            font-size: clamp(36px, 10vw, 56px);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .gameover-btn, .pause-btn {
            padding: 14px 45px;
            font-size: 18px;
            background: #fff;
            color: #1a1a2e;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 8px;
            font-family: inherit;
            font-weight: 600;
            transition: transform 0.2s;
            min-width: 180px;
        }

        .gameover-btn:hover, .pause-btn:hover {
            transform: scale(1.05);
        }

        #finalScore {
            font-size: 22px;
            margin-bottom: 25px;
            color: #ddd;
        }

        .pause-score {
            font-size: 22px;
            margin-bottom: 30px;
            color: #ddd;
        }

        #menuBestScore {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="topBar">
        <a href="index.html" id="homeBtn" title="Home">&#8962;</a>
        <div id="scoreInfo">Score: 0 | Best: 0</div>
        <button id="pauseBtn" title="Pause">&#10074;&#10074;</button>
    </div>

    <div class="screen" id="menuScreen">
        <h1>aa</h1>
        <p class="subtitle">Tap or press Space to shoot pins at the rotating circle</p>
        <div class="difficulty-buttons">
            <button class="diff-btn active" data-diff="easy">Easy</button>
            <button class="diff-btn" data-diff="medium">Medium</button>
            <button class="diff-btn" data-diff="hard">Hard</button>
        </div>
        <p id="menuBestScore">Best Score: 0</p>
        <button id="playBtn">PLAY</button>
    </div>

    <div class="screen" id="gameScreen">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="screen" id="gameOverScreen">
        <h2 id="gameOverText">Game Over</h2>
        <p id="finalScore"></p>
        <button class="gameover-btn" id="restartBtn">Try Again</button>
        <button class="gameover-btn" id="menuBtn">Main Menu</button>
    </div>

    <div class="screen" id="pauseScreen">
        <h2>Paused</h2>
        <p class="pause-score" id="pauseScore">Score: 0</p>
        <button class="pause-btn" id="resumeBtn">Resume</button>
        <button class="pause-btn" id="pauseMenuBtn">Main Menu</button>
    </div>

    <script>
        // ===================== AUDIO =====================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'shoot') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'stick') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(900, now + 0.05);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'pause') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {}
        }

        // ===================== BEST SCORE =====================
        function getBestScore() {
            try {
                const saved = localStorage.getItem('aa_best_score_' + difficulty);
                return saved ? parseInt(saved, 10) : 0;
            } catch (e) {
                return 0;
            }
        }

        function setBestScore(val) {
            try {
                localStorage.setItem('aa_best_score_' + difficulty, val.toString());
            } catch (e) {}
        }

        function updateBestScoreDisplay() {
            const best = getBestScore();
            document.getElementById('menuBestScore').textContent = 'Best Score (' + difficulty.charAt(0).toUpperCase() + difficulty.slice(1) + '): ' + best;
            document.getElementById('scoreInfo').textContent = 'Score: ' + score + ' | Best: ' + best;
        }

        // ===================== GAME =====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let difficulty = 'easy';
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let animId = null;

        const diffSettings = {
            easy:   { speedBase: 0.018, speedVar: 0.008, pinLenMult: 0.85 },
            medium: { speedBase: 0.035, speedVar: 0.015, pinLenMult: 0.80 },
            hard:   { speedBase: 0.055, speedVar: 0.020, pinLenMult: 0.75, reverseChance: 0.4 }
        };

        let centerX, centerY, centerRadius, pinLength;
        let pinWidth, ballRadius, minPinGap;
        let lastTime = 0;
        let pins = [];
        let shootingPin = null;
        let rotation = 0;
        let rotationSpeed = 0;
        let pinSpeed = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            centerX = canvas.width / 2;
            centerY = canvas.height * 0.32;
            centerRadius = Math.min(canvas.width, canvas.height) * 0.17;
            const settings = diffSettings[difficulty];
            pinLength = centerRadius * settings.pinLenMult;
            pinSpeed = Math.min(canvas.height * 0.022, 16);

            // Pin thickness scales with the circle, and the minimum angular gap between
            // pins is derived from their real physical size (the ball at the outer end
            // and the line at the circle edge) instead of a large fixed angle.
            pinWidth = Math.max(2.5, centerRadius * 0.035);
            ballRadius = Math.max(4, centerRadius * 0.075);
            minPinGap = Math.max(
                (2 * ballRadius + 1.5) / (centerRadius + pinLength),
                (pinWidth + 1.5) / centerRadius
            );
        }

        window.addEventListener('resize', () => { resize(); if(!gameRunning || gamePaused) draw(); });

        function spawnPin() {
            shootingPin = {
                x: centerX,
                y: canvas.height - 120,
                moving: false
            };
        }

        function initGame() {
            const settings = diffSettings[difficulty];
            score = 0;
            pins = [];
            rotation = 0;
            rotationSpeed = settings.speedBase + Math.random() * settings.speedVar;
            if (settings.reverseChance && Math.random() < settings.reverseChance) {
                rotationSpeed = -rotationSpeed;
            }

            resize();
            spawnPin();
            gameRunning = true;
            gamePaused = false;
            updateBestScoreDisplay();
        }

        function normalizeAngle(a) {
            while (a < 0) a += Math.PI * 2;
            while (a >= Math.PI * 2) a -= Math.PI * 2;
            return a;
        }

        function angleDiff(a, b) {
            let d = Math.abs(a - b);
            if (d > Math.PI) d = Math.PI * 2 - d;
            return d;
        }

        function checkCollision(newAngle) {
            const threshold = minPinGap;
            for (let pin of pins) {
                if (angleDiff(pin.angle, newAngle) < threshold) {
                    return true;
                }
            }
            return false;
        }

        function update(dt) {
            if (!gameRunning || gamePaused) return;

            rotation += rotationSpeed * dt;

            if (shootingPin && shootingPin.moving) {
                shootingPin.y -= pinSpeed * dt;

                const tipY = shootingPin.y - pinLength;
                const reachY = centerY + centerRadius; // bottom edge of the circle

                if (tipY <= reachY) {
                    shootingPin.y = reachY + pinLength;

                    // The pin travels straight up the centre line, so it always lands at the bottom
                    const hitAngle = normalizeAngle(Math.PI / 2 - rotation);

                    if (checkCollision(hitAngle)) {
                        gameOver();
                        return;
                    }

                    pins.push({ angle: hitAngle });
                    shootingPin = null;
                    score++;
                    updateBestScoreDisplay();
                    playSound('stick');
                    spawnPin();
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let pin of pins) {
                const rad = pin.angle + rotation;
                const x1 = centerX + Math.cos(rad) * centerRadius;
                const y1 = centerY + Math.sin(rad) * centerRadius;
                const x2 = centerX + Math.cos(rad) * (centerRadius + pinLength);
                const y2 = centerY + Math.sin(rad) * (centerRadius + pinLength);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = pinWidth;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x2, y2, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, centerRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold ' + Math.floor(centerRadius * 0.55) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(score, centerX, centerY + 2);

            if (shootingPin) {
                ctx.beginPath();
                ctx.moveTo(shootingPin.x, shootingPin.y);
                ctx.lineTo(shootingPin.x, shootingPin.y - pinLength);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = pinWidth;
                ctx.lineCap = 'round';
                ctx.stroke();

                // ball on the outer end, same as the pins stuck in the circle
                ctx.beginPath();
                ctx.arc(shootingPin.x, shootingPin.y, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            }

            if (gamePaused) {
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function loop(ts) {
            if (!gameRunning) return;
            let dt = 1;
            if (ts !== undefined) {
                if (lastTime) dt = Math.min((ts - lastTime) / 16.667, 3);
                lastTime = ts;
            }
            if (!gamePaused) {
                update(dt);
            }
            draw();
            animId = requestAnimationFrame(loop);
        }

        function startGame() {
            if (animId) cancelAnimationFrame(animId);
            initAudio();
            initGame();
            document.getElementById('pauseBtn').style.display = 'flex';
            lastTime = 0;
            animId = requestAnimationFrame(loop);
        }

        function gameOver() {
            gameRunning = false;
            if (animId) cancelAnimationFrame(animId);

            const best = getBestScore();
            if (score > best) {
                setBestScore(score);
            }

            playSound('lose');
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('gameOverText').textContent = 'Game Over';
            document.getElementById('finalScore').innerHTML = 'Your Score: ' + score + '<br>Best Score: ' + Math.max(score, best);
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function shootPin() {
            if (!gameRunning || gamePaused || !shootingPin || shootingPin.moving) return;
            shootingPin.moving = true;
            playSound('shoot');
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            lastTime = 0;
            if (gamePaused) {
                playSound('pause');
                document.getElementById('pauseScore').textContent = 'Score: ' + score;
                document.getElementById('pauseScreen').style.display = 'flex';
                document.getElementById('pauseBtn').innerHTML = '&#9658;';
            } else {
                document.getElementById('pauseScreen').style.display = 'none';
                document.getElementById('pauseBtn').innerHTML = '&#10074;&#10074;';
            }
        }

        // ===================== INPUT =====================
        function handleAction(e) {
            if (e.type === 'keydown' && e.code !== 'Space' && e.code !== 'ArrowUp') return;
            if (e.type === 'keydown') e.preventDefault();
            if (!gameRunning || gamePaused) return;
            shootPin();
        }

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('a') || e.target.closest('button')) return;
            handleAction(e);
        });
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('a') || e.target.closest('button')) return;
            e.preventDefault();
            handleAction(e);
        }, {passive: false});
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' || e.code === 'KeyP') {
                e.preventDefault();
                togglePause();
                return;
            }
            handleAction(e);
        });

        // ===================== UI =====================
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                playSound('click');
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                difficulty = this.dataset.diff;
                updateBestScoreDisplay();
            });
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            playSound('click');
            initAudio();
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            startGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            playSound('click');
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        });

        document.getElementById('menuBtn').addEventListener('click', () => {
            playSound('click');
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
            document.getElementById('pauseBtn').style.display = 'none';
            gameRunning = false;
            if (animId) cancelAnimationFrame(animId);
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            togglePause();
        });

        document.getElementById('resumeBtn').addEventListener('click', () => {
            playSound('click');
            togglePause();
        });

        document.getElementById('pauseMenuBtn').addEventListener('click', () => {
            playSound('click');
            gamePaused = false;
            gameRunning = false;
            document.getElementById('pauseScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'none';
            document.getElementById('menuScreen').style.display = 'flex';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('pauseBtn').innerHTML = '&#10074;&#10074;';
            if (animId) cancelAnimationFrame(animId);
        });

        // Initial
        resize();
        updateBestScoreDisplay();
    </script>
</body>
</html>
