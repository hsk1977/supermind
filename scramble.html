<!DOCTYPE html>
<html lang="fa" dir="rtl" class="lang-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کلمات درهم</title>
    <style>
        html.lang-pending body { visibility: hidden; }
        :root {
            --bg-color: #fdf6e3;
            --card-bg: #f5e8c7;
            --text-color: #4a3b32;
            --primary-color: #d97706;
            --success-color: #10b981;
            --error-color: #ef4444;
            --line: #b79f66;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }

        header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; direction: ltr; }
        .header-actions { display: flex; gap: 8px; }
        .home-btn { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; border: none; border-radius: 10px; padding: 8px 16px; text-decoration: none; font-size: 14px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1); transition: all .2s ease; display: inline-flex; align-items: center; gap: 4px; }
        .home-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(220,38,38,.25); }
        .lang-btn, .snd-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1); transition: all .2s ease; }
        .lang-btn:hover, .snd-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(37,99,235,.25); }
        .snd-btn.off { background: #9ca3af; }
        .title { font-size: 18px; font-weight: bold; }

        .main-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 14px; flex-grow: 1; padding-top: 6px; }

        .info-box { background: var(--card-bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .bar { height: 10px; background: #fff8e7; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; direction: ltr; }
        .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #fbbf24, #10b981); transition: width .4s; }
        .stats { display: flex; gap: 8px; justify-content: center; }
        .stat { flex: 1; text-align: center; background: #fff8e7; border: 2px solid var(--line); border-radius: 10px; padding: 6px 4px; }
        .stat b { display: block; font-size: 18px; }
        .stat span { font-size: 12px; opacity: .75; }

        .status-box { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        @keyframes btnBlink { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(.96); } }
        .hint-btn { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 25px; padding: 10px 24px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(217,119,6,.3); text-shadow: 0 1px 2px rgba(0,0,0,.2); transition: all .25s ease; animation: btnBlink 1.4s infinite ease-in-out; }
        .hint-btn:not(:disabled):hover { animation: none; transform: translateY(-2px) scale(1.04); }
        .hint-btn:disabled { background: #e5e7eb; color: #9ca3af; border: none; cursor: not-allowed; box-shadow: none; opacity: .7; animation: none; text-shadow: none; }
        .hint-text { font-size: 14px; background: #fff8e7; padding: 8px 12px; border-radius: 8px; border: 1px dashed var(--primary-color); display: none; text-align: center; width: 90%; }

        .slots { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 4px 0; min-height: 58px; }
        .slot { width: 46px; height: 54px; border: 2px dashed var(--line); background: #fff8e7; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; cursor: pointer; transition: border-color .2s, background .2s; }
        .slot.filled { border-style: solid; border-color: var(--primary-color); background: #fff; }
        .slots.ok .slot { border-color: var(--success-color); background: #d1fae5; color: #047857; }
        .slots.bad { animation: shake .4s; }
        .slots.bad .slot { border-color: var(--error-color); background: #fee2e2; color: #b91c1c; }
        @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

        .actions { display: flex; gap: 10px; }
        .small-btn { background: #fff8e7; border: 2px solid var(--line); color: var(--text-color); border-radius: 10px; padding: 8px 18px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
        .small-btn:active { transform: translateY(3px); box-shadow: none; }

        /* ===== صفحهٔ سه‌بعدی حروف ===== */
        .board-wrap { width: 100%; max-width: 480px; margin-top: auto; padding: 6px 0 14px; perspective: 700px; }
        .kb-board { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 16px 10px 18px; background: linear-gradient(180deg, #e8d7ab, #d9c48f); border-radius: 14px; box-shadow: 0 10px 0 #b79f66, 0 18px 22px rgba(74,59,50,.35); transform: rotateX(16deg); transform-origin: 50% 100%; transform-style: preserve-3d; }
        .key { width: clamp(46px, 13vw, 58px); height: clamp(48px, 13vw, 58px); background: linear-gradient(180deg, #fff, #f3ecd8); border: 1px solid #dcd1b4; border-radius: 8px; font-size: 24px; font-weight: bold; color: var(--text-color); cursor: pointer; display: flex; align-items: center; justify-content: center; transform: translateZ(8px); box-shadow: 0 5px 0 #b9a674, 0 8px 10px rgba(0,0,0,.22); transition: transform .12s ease, box-shadow .12s ease, background .15s; }
        .key:hover { background: linear-gradient(180deg, #fffdf4, #ffeab8); border-color: var(--primary-color); transform: translateZ(14px) translateY(-2px); }
        .key:active { transform: translateZ(2px) translateY(4px); box-shadow: 0 1px 0 #b9a674; }
        .key.used { visibility: hidden; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: all .3s; z-index: 10; }
        .modal.show { visibility: visible; opacity: 1; }
        .modal-content { background: var(--bg-color); padding: 25px; border-radius: 16px; text-align: center; width: 85%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,.2); }
        .restart-btn { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(217,119,6,.3); transition: all .2s ease; }
        .restart-btn:hover { transform: translateY(-2px); }
        #fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
    </style>
</head>
<body>

    <header>
        <div class="header-actions">
            <a href="index.html" class="home-btn">🏠 <span id="home-text">خانه</span></a>

        <div class="title" id="game-title">کلمات درهم</div>

    <div class="main-container">
        <div class="info-box">

        <div class="status-box">

            <div id="hint-text" class="hint-text"></div>

        <div id="slots" class="slots"></div>
        <div class="actions">

            <button class="small-btn" id="shuffle-btn" onclick="reshuffle()">ترکیب مجدد</button>

        <div class="board-wrap"><div id="tiles" class="kb-board"></div></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <button class="restart-btn" id="modal-btn"></button>
        </div>
    </div>
    <canvas id="fx"></canvas>

: "False statement"}, {"word": "Clothing", "hint": "Garments worn"}, {"word": "Concert", "hint": "Live musical performance"}, {"word": "Everest", "hint": "Highest mountain peak"}, {"word": "Divorce", "hint": "Legal marriage dissolution"}, {"word": "Thermos", "hint": "Insulated liquid container"}, {"word": "Skeleton", "hint": "Bony body framework"}, {"word": "Boxing", "hint": "Combat sport with fists"}, {"word": "Taxi", "hint": "Urban public transport vehicle"}, {"word": "Skate", "hint": "Glide on ice or wheels"}, {"word": "Coconut", "hint": "Large tropical drupe fruit"}, {"word": "Vitamin", "hint": "Essential organic nutrient"}, {"word": "Grape", "hint": "Small clustering fruit"}, {"word": "Fruit juice", "hint": "Pressed fruit liquid"}, {"word": "Police", "hint": "Law enforcement officers"}, {"word": "Omelet", "hint": "Folded beaten egg dish"}, {"word": "Clown", "hint": "Comic circus performer"}, {"word": "Theft", "hint": "Act of stealing property"}, {"word": "Squirrel", "hint": "Bushy-tailed rodent"}, {"word": "smile", "hint": "facial expression showing happiness"}, {"word": "light bulb", "hint": "glass globe emitting light"}, {"word": "square", "hint": "four-sided equal shape"}, {"word": "tennis", "hint": "racket sport played over net"}, {"word": "gem", "hint": "precious or semiprecious stone"}, {"word": "orange", "hint": "citrus fruit or color"}, {"word": "scary", "hint": "causing fear or terror"}, {"word": "display", "hint": "screen or visual presentation"}, {"word": "stadium", "hint": "large arena for sports"}, {"word": "makeup", "hint": "cosmetics applied to face"}, {"word": "villa", "hint": "large luxurious country house"}, {"word": "cowardly", "hint": "lacking courage or brave spirit"}, {"word": "gloves", "hint": "hand coverings with separate fingers"}, {"word": "mirror", "hint": "reflective glass surface"}, {"word": "chips", "hint": "crispy fried potato slices"}, {"word": "Olympics", "hint": "international multi-sport event"}, {"word": "meeting", "hint": "assembly of people for discussion"}, {"word": "archive", "hint": "collection of historical records"}, {"word": "skirt", "hint": "garment hanging from waist"}, {"word": "Courage", "hint": "Bravery in facing danger"}, {"word": "Club", "hint": "A group or society"}, {"word": "Spokesperson", "hint": "Speaks on behalf of others"}, {"word": "Cheating", "hint": "Breaking rules to gain advantage"}, {"word": "Scale", "hint": "Device for measuring weight"}, {"word": "Neighbor", "hint": "Person living next door"}, {"word": "Statue", "hint": "Carved or cast figure"}, {"word": "Scarecrow", "hint": "Field figure scaring birds"}, {"word": "Lighter", "hint": "Device that makes a flame"}, {"word": "Hamster", "hint": "Small pet rodent"}, {"word": "Vanilla", "hint": "Sweet flavoring from orchid pods"}, {"word": "East", "hint": "Direction of sunrise"}, {"word": "Barrel", "hint": "Large round wooden container"}, {"word": "Sugarcane", "hint": "Tall plant that yields sugar"}, {"word": "Diamond", "hint": "Hard, brilliant gemstone"}, {"word": "Happy", "hint": "Feeling joy or pleasure"}]};

        let currentLang = 'fa', byLen = {}, lens = [], list = [], cur = null;
        let solved = new Set(), curLen = 0, pos = 0;   // کلمه‌های حل‌شده (برای هر زبان جدا ذخیره می‌شود)
        let tiles = [], slots = [], moves = 0, fails = 0, locked = false, soundOn = true;
        const $ = id => document.getElementById(id);
        const nf = n => currentLang === 'fa' ? n.toLocaleString('fa-IR') : String(n);
        const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

        // ---------- صدا ----------
        let ac;
        const AC = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
        function tone(f, d = .12, type = 'sine', at = 0, v = .15) {
            if (!soundOn) return;
            try { const c = AC(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + at;
                o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t);
                g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
            } catch (e) {}
        }
        function boom() {
            if (!soundOn) return;
            try { const c = AC(), n = c.sampleRate * .4, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
                const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
                f.type = 'lowpass'; f.frequency.value = 900; s.buffer = b; g.gain.value = .4;
                s.connect(f); f.connect(g); g.connect(c.destination); s.start();
            } catch (e) {}
        }
        const sfx = {
            pick: () => tone(520, .07, 'triangle'),
            back: () => tone(330, .07, 'triangle'),
            click: () => tone(440, .05, 'square', 0, .06),
            bad: () => { tone(200, .2, 'sawtooth', 0, .12); tone(150, .25, 'sawtooth', .12, .12); },
            win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', i * .1)),
            lvl: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'square', i * .09, .08))
        };
        function toggleSound() {
            soundOn = !soundOn;
            $('snd-btn').classList.toggle('off', !soundOn);
            $('snd-btn').textContent = soundOn ? '🔊' : '🔇';
            if (soundOn) sfx.click();
        }

        // ---------- آتش‌بازی ----------
        const cv = $('fx'), cx = cv.getContext('2d');
        let ps = [], running = false, endT = 0;
        function resize() { cv.width = innerWidth; cv.height = innerHeight; }
        addEventListener('resize', resize); resize();
        function burst(x, y) {
            const h = Math.random() * 360;
            for (let i = 0; i < 70; i++) {
                const a = Math.random() * 6.283, s = Math.random() * 5 + 1.5;
                ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 1, c: `hsl(${h + Math.random() * 40},100%,55%)` });
            }
            boom();
        }
        function fireworks() {
            endT = performance.now() + 2600;
            for (let i = 0; i < 6; i++) setTimeout(() => burst(innerWidth * (.15 + Math.random() * .7), innerHeight * (.12 + Math.random() * .4)), i * 380);
            if (!running) { running = true; loop(); }
        }
        function loop() {
            cx.clearRect(0, 0, cv.width, cv.height);
            ps = ps.filter(p => p.l > 0);
            ps.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.vy += .06; p.vx *= .985; p.l -= .013;
                cx.globalAlpha = Math.max(p.l, 0); cx.fillStyle = p.c;
                cx.beginPath(); cx.arc(p.x, p.y, 2.6, 0, 6.283); cx.fill();
            });
            if (ps.length || performance.now() < endT) requestAnimationFrame(loop);
            else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
        }

        // ---------- زبان و بارگذاری ----------
        function toggleLanguage() {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            updateUI();
            loadWords();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
            document.title = t.title;
            $('game-title').textContent = t.title;
            $('home-text').textContent = t.home;
            $('hint-btn-text').textContent = t.hint;
            $('lb-word').textContent = t.word;
            $('lb-moves').textContent = t.moves;
            $('lb-len').textContent = t.len;
            $('clear-btn').textContent = t.clear;
            $('shuffle-btn').textContent = t.shuffle;
            $('lang-toggle-btn').textContent = t.langToggle;
        }

        async function loadWords() {
            const file = currentLang === 'fa' ? './words.json' : './words_en.json';
            let data;
            try {
                const res = await fetch(`${file}?v=${Date.now()}`);
                if (!res.ok) throw new Error('File not found');
                data = await res.json();
                if (!Array.isArray(data) || !data.length) throw new Error('Empty');
            } catch (err) {
                data = EMBED[currentLang];
            }
            buildLevels(data);
            loadSolved();
            startLevel();
        }

        // کلید یکتا برای هر کلمه (فاصله، نیم‌فاصله و شکل‌های مختلف «ی» و «ک» یکی حساب می‌شوند)
        const normKey = w => String(w).replace(/[\s\u200c\u200d]/g, '').replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/[\u064B-\u065F]/g, '').toLowerCase();

        // گروه‌بندی بر اساس تعداد حروف: ۴ حرفی، بعد ۵ حرفی و ... (کلمات تکراری حذف می‌شوند)
        function buildLevels(raw) {
            const seen = new Set(); byLen = {};
            raw.forEach(o => {
                const w = String(o.word || '').replace(/\s+/g, '');
                const key = normKey(w), L = [...w].length;
                if (!w || seen.has(key) || L < 4) return;
                seen.add(key);
                (byLen[L] = byLen[L] || []).push({ w: currentLang === 'en' ? w.toUpperCase() : w, h: o.hint, k: key });
            });
            lens = Object.keys(byLen).map(Number).sort((a, b) => a - b);
        }

        const skey = () => 'scramble-solved-' + currentLang;
        function loadSolved() { try { solved = new Set(JSON.parse(localStorage.getItem(skey())) || []); } catch (e) { solved = new Set(); } }
        function save() { try { localStorage.setItem(skey(), JSON.stringify([...solved])); } catch (e) {} }
        const unsolvedIn = L => byLen[L].filter(x => !solved.has(x.k));

        // کمترین طولی که هنوز کلمهٔ حل‌نشده دارد (کلمات جدیدی که به فایل اضافه شود خودکار وارد می‌شود)
        function startLevel() {
            const L = lens.find(l => unsolvedIn(l).length);
            if (L === undefined) return allDone();
            curLen = L;
            list = shuf(unsolvedIn(L)); pos = 0;
            $('st-len').textContent = nf(L);
            loadWord();
        }

        // ---------- بازی ----------
        function loadWord() {
            if (pos >= list.length) return levelDone();
            cur = list[pos];
            const chars = [...cur.w];
            let t;
            do { t = shuf(chars.map(c => ({ c, u: false }))); }
            while (t.map(x => x.c).join('') === cur.w && new Set(chars).size > 1);
            tiles = t; slots = chars.map(() => null); moves = 0; locked = false;
            fails = 0; $('hint-btn').disabled = true;   // راهنما بعد از ۳ تلاش ناموفق روشن می‌شود
            $('hint-text').style.display = 'none';
            draw(); stats();
        }

        function stats() {
            const total = byLen[curLen].length, done = total - (list.length - pos);
            $('st-word').textContent = nf(Math.min(done + 1, total)) + ' / ' + nf(total);
            $('st-moves').textContent = nf(moves);
            $('bar').style.width = (done / total * 100) + '%';
        }

        function draw() {
            const sr = $('slots'), tr = $('tiles');
            sr.className = 'slots'; sr.innerHTML = ''; tr.innerHTML = '';
            slots.forEach((s, i) => {
                const d = document.createElement('div');
                d.className = 'slot' + (s !== null ? ' filled' : '');
                d.textContent = s !== null ? tiles[s].c : '';
                d.onclick = () => back(i);
                sr.appendChild(d);
            });
            tiles.forEach((t, i) => {
                const b = document.createElement('button');
                b.className = 'key' + (t.u ? ' used' : '');
                b.textContent = t.c;
                b.onclick = () => pick(i);
                tr.appendChild(b);
            });
        }

        function pick(i) {
            if (locked || tiles[i].u) return;
            const k = slots.indexOf(null);
            if (k < 0) return;
            slots[k] = i; tiles[i].u = true; moves++;
            sfx.pick(); draw(); stats();
            if (slots.indexOf(null) < 0) check();
        }
        function back(k) {
            if (locked || slots[k] === null) return;
            tiles[slots[k]].u = false; slots[k] = null;
            sfx.back(); draw();
        }
        function clearAll() {
            if (locked) return;
            slots.forEach((s, k) => { if (s !== null) { tiles[s].u = false; slots[k] = null; } });
            sfx.click(); draw();
        }
        function reshuffle() {
            if (locked) return;
            clearAll(); tiles = shuf(tiles); sfx.click(); draw();
        }

        function check() {
            locked = true;
            const guess = slots.map(i => tiles[i].c).join('');
            if (guess === cur.w) {
                $('slots').classList.add('ok');
                sfx.win(); fireworks();
                solved.add(cur.k); pos++; save();
                setTimeout(() => { pos >= list.length ? levelDone() : loadWord(); }, 2800);
            } else {
                $('slots').classList.add('bad');
                sfx.bad();
                if (++fails >= 3) $('hint-btn').disabled = false;
                setTimeout(() => { locked = false; clearAll(); }, 600);
            }
        }

        function levelDone() {
            stats(); sfx.lvl(); fireworks();
            const nextL = lens.find(l => unsolvedIn(l).length);
            if (nextL === undefined) return allDone();
            const t = translations[currentLang];
            $('modal-title').textContent = t.lvlTitle;
            $('modal-message').textContent = t.lvlMsg.replace('{n}', nf(nextL));
            $('modal-btn').textContent = t.next;
            $('modal-btn').onclick = () => { $('modal').classList.remove('show'); startLevel(); };
            $('modal').classList.add('show');
        }

        function allDone() {
            const t = translations[currentLang];
            $('modal-title').textContent = t.allTitle;
            $('modal-message').textContent = t.allMsg;
            $('modal-btn').textContent = t.again;
            $('modal-btn').onclick = () => { solved = new Set(); save(); $('modal').classList.remove('show'); startLevel(); };
            $('modal').classList.add('show');
        }

        $('hint-btn').onclick = () => {
            const h = $('hint-text');
            h.textContent = (cur && cur.h) || translations[currentLang].noHint;
            h.style.display = 'block';
            sfx.click();
        };

        // ---------- تشخیص زبان بر اساس کشور (IP) ----------
        const GEO_SERVICES = [
            async (signal) => (await (await fetch('https://api.country.is/', { signal })).json()).country,
            async (signal) => (await (await fetch('https://get.geojs.io/v1/ip/country.json', { signal })).json()).country,
            async (signal) => (await (await fetch('https://ipapi.co/country/', { signal })).text()).trim()
        ];
        async function detectLang() {
            for (const svc of GEO_SERVICES) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 2000);
                try {
                    const country = String(await svc(ctrl.signal) || '').trim().toUpperCase();
                    clearTimeout(timer);
                    if (/^[A-Z]{2}$/.test(country)) return country === 'IR' ? 'fa' : 'en';
                } catch (e) { clearTimeout(timer); }
            }
            return (navigator.language || '').toLowerCase().startsWith('fa') ? 'fa' : 'en';
        }

        (async function start() {
            currentLang = await detectLang();
            updateUI();
            document.documentElement.classList.remove('lang-pending');
            loadWords();
        })();
    </script>
